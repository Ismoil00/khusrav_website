        <a class="nav-item" href="#resources" ${page === 'resources' ? 'aria-current="page"' : ''}><span class="nav-ico">${I.res}</span>Videos and audio</a>
        <a class="nav-item" href="#teacher" ${page === 'teacher' ? 'aria-current="page"' : ''}><span class="nav-ico">${I.teach}</span>Teacher's guide</a>
      </nav>
      <div class="side-foot">
        <div class="meter">
          <div class="meter-row"><span>Covered together</span><b>${t} of ${n}</b><div class="bar t"><i style="width:${(t / n * 100).toFixed(1)}%"></i></div></div>
          <div class="meter-row"><span>Practiced alone</span><b>${s} of ${n}</b><div class="bar s"><i style="width:${(s / n * 100).toFixed(1)}%"></i></div></div>
          <div class="meter-row"><span>Tests passed</span><b>${passed} of ${tn}</b><div class="bar x"><i style="width:${(passed / tn * 100).toFixed(1)}%"></i></div></div>
        </div>
        <button id="sync-btn" class="sync-btn" data-act="share"></button>
        <button class="btn" data-act="settings">${I.gear}Settings and voices</button>
      </div>`;
    paintSync();
  }

  function renderTop(title) {
    $('#top').innerHTML = `
      <button class="btn icon-btn menu-btn" data-act="menu" aria-label="Open menu">${I.menu}</button>
      <div class="top-title">${esc(title)}</div>
      <div class="tools">
        <div class="seg ${S.tr ? '' : 'off'}" role="group" aria-label="Translations">
          <button class="tr-main" data-act="tr" aria-pressed="${S.tr}" title="Show or hide Russian / Tajik translations">${S.tr ? I.eye : I.eyeOff}<span class="lbl-long">${S.tr ? 'Translation on' : 'Translation off'}</span></button>
          <button class="lang" data-act="lang" data-lang="ru" aria-pressed="${S.tr && S.lang === 'ru'}">RU</button>
          <button class="lang" data-act="lang" data-lang="tj" aria-pressed="${S.tr && S.lang === 'tj'}">TJ</button>
        </div>
 <button class="btn tx-btn" data-act="translator" title="Translate a word and hear how it sounds" aria-label="Translate and listen">${I.translate}<span class="lbl-long">Translate</span></button>
        <button class="btn teach-toggle" data-act="teach" aria-pressed="${S.teacher}" title="Show or hide the notes for the teacher">${I.teach}<span class="lbl-long">Teacher notes</span></button>
        <button class="btn icon-btn" data-act="settings" aria-label="Settings and voices">${I.gear}</button>
        <button class="btn icon-btn" data-act="theme" aria-label="Switch to ${isDark() ? 'light' : 'dark'} theme">${isDark() ? I.sun : I.moon}</button>
      </div>`;
  }

  /* ---------------- shared components ---------------- */
  const REG = {}; let regN = 0;
  const reg = (text, who, lesson) => { const k = 'r' + (++regN); REG[k] = { text, who, lesson }; return k; };
  const playBtn = (text, who, lesson, small, label) => `<button class="play ${small ? 'small' : ''}" data-act="say" data-k="${reg(text, who, lesson)}" aria-label="${esc(label || 'Listen: ' + nm(text))}">${I.spk}</button>`;
  const micBtn = (text, small) => SR ? `<button class="play mic ${small ? 'small' : ''}" data-act="mic" data-k="${reg(text, 'y', null)}" aria-label="Say it and check">${I.mic}</button>` : '';

  const tickBtns = (id) => {
    const p = prog(id);
    return `<div class="ticks">
      <button class="tick t" data-act="tick" data-id="${id}" data-k="t" aria-pressed="${!!p.t}"><span class="tbox">${I.check}</span><span><b>Covered together</b><small>Teacher and student did this lesson</small></span></button>
      <button class="tick s" data-act="tick" data-id="${id}" data-k="s" aria-pressed="${!!p.s}"><span class="tbox">${I.check}</span><span><b>Practiced alone</b><small>Student repeated it on his own</small></span></button>
    </div>`;
  };

  const tip = (txt) => `<div class="tip">${diamond()}<div><b>For the teacher.</b> ${txt}</div></div>`;

  function quizHTML(items, lesson, withAudio) {
    return `<div class="quiz" data-total="${items.length}">${items.map((q, qi) => `
      <div class="q" data-a="${q.a}">
        <div class="q-top">${withAudio ? playBtn(q.say, 't', lesson, false, 'Play the audio') : ''}<div class="q-text">${E(q.q)}</div></div>
        <div class="opts">${q.o.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${E(o)}</span></button>`).join('')}</div>
        ${withAudio ? `<div class="transcript"><b>You heard:</b> “${E(q.say)}”</div>` : ''}
        ${q.why ? `<div class="why">${E(q.why)}</div>` : ''}
      </div>`).join('')}<div class="score" aria-live="polite"></div></div>`;
  }

  function readArtifact(r) {
    if (r.kind === 'phone') {
      return `<div class="phone"><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>5G ▮▮▮</span></div>
        <div class="app-head">${E(r.app)}<small>${E(r.sub || '')}</small></div>
        <div class="app-body">${r.rows.map((x) => `<div class="app-row ${x[2] || ''}"><span class="lab">${E(x[0])}</span>${E(x[1])}</div>`).join('')}
        ${(r.btns || []).map((b, i) => `<div class="app-btn ${i ? 'alt' : ''}">${E(b)}</div>`).join('')}</div></div></div>`;
    }
    if (r.kind === 'sms') {
      return `<div class="phone"><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>5G ▮▮▮</span></div>
        <div class="app-head">${E(r.title)}<small>Messages</small></div>
        <div class="sms">${r.msgs.map((m) => `<div class="m ${m[0] === 'me' ? 'me' : m[0] === 'sys' ? 'sys' : m[0] === 'warn' ? 'warnm' : ''}">${E(m[1])}</div>`).join('')}</div></div></div>`;
    }
    if (r.kind === 'receipt') return `<div class="paper receipt"><pre>${E(r.text)}</pre></div>`;
    if (r.kind === 'id') {
      return `<div class="idcard" role="img" aria-label="Sample ID card"><div class="idt"><span>SAMPLE ID</span><span>ILLINOIS</span></div>
        <div class="photo"><svg viewBox="0 0 60 60"><circle cx="30" cy="22" r="11" fill="#8C9AA2"/><path d="M10 56a20 20 0 0 1 40 0z" fill="#8C9AA2"/></svg></div>
        <div><span class="lab">NAME</span><b>${E(r.name)}</b></div>${r.rows.map((x) => `<div><span class="lab">${E(x[0])}</span>${E(x[1])}</div>`).join('')}</div>`;
    }
    if (r.kind === 'buzz') {
      return `<div class="panel-buzz"><div class="grill"></div>${r.rows.map((x) => `<div class="bz"><span><b>${E(x[0])}</b>&nbsp;&nbsp;${E(x[1])}</span><i></i></div>`).join('')}<div class="lbl">${E(r.note)}</div></div>`;
    }
    if (r.kind === 'corner') {
      return `<div class="corner" role="img" aria-label="Street signs on a corner: ${esc(r.rows.map((x) => x[0] + ' ' + x[1]).join(', '))}">${r.rows.map((x, i) => `<div class="ssign s${i}"><b>${E(x[0])}</b><small>${E(x[1])}</small></div>`).join('')}<div class="pole"></div></div>`;
    }
    if (r.kind === 'paper') {
      const st = r.style || 'plain';
      let body = '';
      if (r.kv) body += `<dl class="kv">${r.kv.map((x) => `<dt>${E(x[0])}</dt><dd>${E(x[1])}</dd>`).join('')}</dl>`;
      if (r.text) body += `<div style="display:grid;gap:8px">${r.text.map((x) => `<p>${E(x)}</p>`).join('')}</div>`;
      if (r.list) body += `<ul>${r.list.map((x) => `<li>${E(x)}</li>`).join('')}</ul>`;
      if (r.fields) body += r.fields.map((x) => `<div class="field"><span>${E(x[0])}</span><b>${E(x[1])}</b></div>`).join('');
      return `<div class="paper ${st}">${r.sample ? '<span class="sample">Sample for practice</span>' : ''}<h4>${E(r.title)}</h4>${body}</div>`;
    }
    return '';
  }

  function signCards(ids, lesson) {
    return `<div class="signs">${ids.map((id) => {
      const s = window.SIGNS[id];
      return `<div class="sign-card"><button class="btn ghost" data-act="signflip" data-k="${reg(s.mean, 'y', lesson)}" aria-label="Show what ${esc(s.name)} means" style="padding:4px">${window.signSVG(id)}</button><span class="sname">${esc(s.name)}</span><span class="mean">${esc(s.mean)}</span></div>`;
    }).join('')}</div>`;
  }

  /* ---------------- pages ---------------- */
  function pageBook() {
    const next = LESSONS.find((l) => !prog(l.id).t) || LESSONS[0];
    const t = countDone('t'), s = countDone('s');
    const units = UNITS.map((u) => {
      const done = u.lessons.filter((l) => prog(l.id).t).length;
      return `<section class="unit" aria-labelledby="u${u.n}">
        <div class="unit-head">${window.shieldSVG(u.n)}<div><h2 id="u${u.n}">${esc(u.title)}</h2><p>${esc(u.sub)}</p></div><span class="unit-side"><span class="unit-prog">${done} of ${u.lessons.length}</span><a class="unit-test" href="#test-u${u.n}">${I.test}Unit test${S.tests['u' + u.n] ? ` · best ${S.tests['u' + u.n].best}/${S.tests['u' + u.n].total}` : ''}</a></span></div>
        <div class="lessons">${u.lessons.map((l) => {
          const p = prog(l.id);
          return `<a class="lcard" href="#lesson-${l.id}"><div class="thumb">${window.sceneSVG(l.scene, l.title)}</div><div class="lc-body"><span class="lc-num">EXIT ${lnum(l)}</span><h3>${esc(l.title)}</h3><div class="lc-ticks"><span class="chip t ${p.t ? 'on' : ''}">${p.t ? I.check : ''}Together</span><span class="chip s ${p.s ? 'on' : ''}">${p.s ? I.check : ''}Alone</span></div></div></a>`;
        }).join('')}</div></section>`;
    }).join('');
    return `
      <section class="hero">
        <div class="hero-text">
          <h1>Street English Chicago</h1>
          <p>50 real conversations from the first months in Chicago: delivery orders, police stops, shops and offices, road signs, and the roadside English check for truck drivers. Listen first, then speak, then test yourself.</p>
          <div class="hero-actions"><a class="btn white" href="#lesson-${next.id}">${I.play}${t ? 'Continue' : 'Start'}: ${lnum(next)} ${esc(next.title)}</a><a class="btn primary" href="#tests">${I.test}Tests</a></div>
        </div>
        <div class="hero-art">${window.sceneSVG('hero', 'Chicago skyline with a delivery car and a truck', 'xMidYMax meet')}</div>
      </section>
      <div class="teacher-only">${tip('Each lesson has five steps: Listen, Key phrases, Check your ears, Read it, Your turn. Your notes are in the yellow boxes. Tick “Covered together” after you do a lesson with him; he ticks “Practiced alone” after he repeats it at home. The 6-week plan is in the Teacher\'s guide.')}</div>
      <div class="notice">${I.info}<span>${t} of ${LESSONS.length} lessons covered together, ${s} practiced alone. Every line has a play button: tap it to hear an American voice. Turn on translations at the top only when you need them.${syncOn() ? '' : ' Using two devices? Turn on <a href="#" data-act="share">sync</a> so both show the same progress.'}</span></div>
      ${units}`;
  }

  let CUR = null;
  function pageLesson(l) {
    CUR = l;
    const idx = LESSONS.indexOf(l), prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
    const who = l.who;
    const initials = (w) => w === 'y' ? 'YOU' : (who[w].n.split(/\s+/).map((x) => x[0]).join('').slice(0, 2).toUpperCase());
    const lines = l.lines.map((ln, i) => {
      const w = ln[0];
      return `<div class="line ${w}" id="ln-${i}"><div class="ava" aria-hidden="true">${initials(w)}</div>
        <button class="bub" data-act="line" data-i="${i}"><span class="who">${esc(w === 'y' ? 'You' : who[w].n)} ${I.spk}</span><span class="en">${E(ln[1])}</span>${tr(ln[2], ln[3])}</button></div>`;
    }).join('');
    const phrases = l.phrases.map((p) => `<div class="card"><div class="en">${E(p[0])}</div>${tr(p[1], p[2])}${p[3] ? `<div class="note">${E(p[3])}</div>` : ''}<div class="card-actions">${playBtn(p[0], 'y', l)}${micBtn(p[0])}</div><div class="heard"></div></div>`).join('');
    const say = l.say.map((s) => `<div class="say-card"><div class="say-cue">${E(s[0])}${tr(s[2], s[3])}</div><button class="btn small" data-act="reveal">${I.eye}Show the answer</button><div class="say-ans"><span class="en">${E(s[1])}</span><div class="card-actions">${playBtn(s[1], 'y', l)}${micBtn(s[1])}</div><div class="heard"></div></div></div>`).join('');
    const r = l.read;
    const readBlock = r.kind === 'signs'
      ? `${signCards(r.ids, l)}${quizHTML(r.qs, l, false)}`
      : `<div class="read-grid">${readArtifact(r)}${quizHTML(r.qs, l, false)}</div>`;
    const tc = l.teach;
    return `
      <div class="sign-wrap"><span class="exit-tab">EXIT ${lnum(l)}</span>
        <header class="guide"><h1>${esc(l.title)}</h1><p class="where">${I.pin}<span>${E(l.where)}</span></p><p class="goal">Goal: ${E(l.goal)}</p></header>
      </div>
      <div class="scene">${window.sceneSVG(l.scene, l.title)}</div>
      ${tickBtns(l.id)}
      <details class="teach"><summary>${diamond()}<span><span class="teach-label">For the teacher</span><span class="teach-hint">How to teach this lesson</span></span><span class="chev">${I.chev}</span></summary>
        <div class="teach-body">
          <div><h4>AIM</h4><p>${E(tc.aim)}</p></div>
          <div><h4>STEPS</h4><ol>${tc.steps.map((x) => `<li>${E(x)}</li>`).join('')}</ol></div>
          <div><h4>WATCH OUT FOR</h4><ul>${tc.watch.map((x) => `<li>${E(x)}</li>`).join('')}</ul></div>
          ${tc.extra && tc.extra.length ? `<div><h4>EXTRA PRACTICE</h4><ul>${tc.extra.map((x) => `<li>${E(x)}</li>`).join('')}</ul></div>` : ''}
        </div>
      </details>

      <section class="step" aria-labelledby="st1"><div class="step-head"><span class="step-num">1</span><div><h2 id="st1">Listen</h2><p>Tap any line to hear it. Use “Hide text” to train your ears.</p></div></div>
        ${tip('Play it once with the text hidden. Ask two questions in Tajik or Russian about what happened. Then show the text and play it again. Finish with the role-play.')}
        <div class="panel">
          <div class="dlg-bar">
            <button class="btn primary" data-act="playall">${I.play}Play all</button>
            <button class="btn" data-act="blind" aria-pressed="false">${I.eyeOff}Hide text</button>
            <button class="btn" data-act="rp">${I.users}Role-play: you speak</button>
            <button class="btn" data-act="slow" aria-pressed="${S.rate < 0.9}">${I.turtle}Slow</button>
          </div>
          <div class="dlg" id="dlg">${lines}</div>
          <div class="rp-box" id="rp" aria-live="polite"></div>
        </div>
      </section>

      <section class="step" aria-labelledby="st2"><div class="step-head"><span class="step-num">2</span><div><h2 id="st2">Key phrases</h2><p>Listen, repeat three times, then say it without looking.</p></div></div>
        ${tip('Say each phrase; he repeats it three times. Then reverse: you say the meaning in Tajik or Russian, he answers in English.')}
        <div class="cards">${phrases}</div>
      </section>

      <section class="step" aria-labelledby="st3"><div class="step-head"><span class="step-num">3</span><div><h2 id="st3">Check your ears</h2><p>Press play, listen, choose the answer. The text appears after you answer.</p></div></div>
        ${tip('Don\'t read the text aloud. Let the app speak, and let him answer before you help.')}
        ${quizHTML(l.ears, l, true)}
      </section>

      <section class="step" aria-labelledby="st4"><div class="step-head"><span class="step-num">4</span><div><h2 id="st4">Read it</h2><p>${E(r.intro)}</p></div></div>
        ${tip('He reads it aloud. Correct only the words that change the meaning, like numbers and names.')}
        ${readBlock}
      </section>

      <section class="step" aria-labelledby="st5"><div class="step-head"><span class="step-num">5</span><div><h2 id="st5">Your turn</h2><p>Read the situation. Say your answer out loud first, then check it.</p></div></div>
        ${tip('Push for speed. If he is stuck, turn on the translation instead of showing the answer.')}
        <div class="say">${say}</div>
      </section>

      ${tickBtns(l.id)}
      <nav class="pager" aria-label="Lessons">
        ${prev ? `<a class="btn" href="#lesson-${prev.id}">${I.left}<span><span class="dir">Previous</span>${lnum(prev)} ${esc(prev.title)}</span></a>` : '<span></span>'}
        ${next ? `<a class="btn primary" href="#lesson-${next.id}"><span><span class="dir" style="color:inherit;opacity:.85">Next</span>${lnum(next)} ${esc(next.title)}</span>${I.right}</a>` : `<a class="btn primary" href="#test-roadside">${I.test}Take the roadside English check</a>`}
      </nav>`;
  }

  function pageTeacher() {
    const T = window.TEACHER;
    const link = (id) => { const l = byId(id); const p = prog(id); return `<div class="wk-l"><span class="toc-ticks"><i class="tdot t ${p.t ? 'on' : ''}"></i><i class="tdot s ${p.s ? 'on' : ''}"></i></span><a href="#lesson-${id}">${lnum(l)} ${esc(l.title)}</a></div>`; };
    const cpTitle = (id) => { const c = T.checkpoints.find((x) => x.id === id); return c ? esc(c.title.split(':')[0]) : ''; };
    return `
      <div class="sign-wrap"><span class="exit-tab">FOR THE TEACHER</span>
        <header class="guide"><h1>Teacher's guide</h1><p class="where">${I.teach}<span>How to run the six weeks, one session, and the final check.</span></p></header>
      </div>
      <div class="prose">${T.intro.map((p) => `<p class="lede">${esc(p)}</p>`).join('')}</div>

      <section class="step"><h2 class="h-sec">The 6-week plan</h2>
        <p style="color:var(--muted)">36 core lessons in six weeks: four sessions a week with you, about 90 minutes each, plus 40 minutes of homework a day. The other 14 lessons are for his first months in Chicago. If you meet less often, stretch the weeks rather than skipping role-plays.</p>
        <div class="panel scroll-x"><table class="week-table"><thead><tr><th>Week</th><th>Lessons</th><th>Focus</th><th>Test and checkpoint</th></tr></thead><tbody>
          ${T.weeks.map((w) => { const tt = testById(w.test); return `<tr><td><b style="font-family:var(--f-sign)">Week ${w.w}</b><br><span style="color:var(--muted);font-size:13.5px">${esc(w.title)}</span></td><td><div style="display:grid;gap:4px">${w.lessons.map(link).join('')}</div></td><td>${esc(w.focus)}</td><td><div style="display:grid;gap:6px">${tt ? `<a href="#test-${tt.id}">${I.test}${esc(tt.title.split(':')[0])}${S.tests[tt.id] ? ` · ${S.tests[tt.id].best}/${S.tests[tt.id].total}` : ''}</a>` : ''}${w.cp ? `<a href="#cp-${w.cp}">${cpTitle(w.cp)}</a>` : ''}</div></td></tr>`; }).join('')}
        </tbody></table></div>
        <div class="box later"><h3>${esc(T.later.title)}</h3><p style="color:var(--muted);font-size:15px">${esc(T.later.focus)}</p><div class="later-grid">${T.later.lessons.map(link).join('')}</div></div>
      </section>

      <section class="step"><h2 class="h-sec">Checkpoints</h2>
        <p style="color:var(--muted)">He moves on only after passing. A failed checkpoint means repeating that phase's role-plays.</p>
        ${T.checkpoints.map((c) => `<div class="box" id="cp-${c.id}"><h3>${esc(c.title)}</h3><span style="color:var(--muted);font-size:14px">${esc(c.when)}</span><ul>${c.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <button class="tick t" data-act="cp" data-id="${c.id}" aria-pressed="${!!S.cps[c.id]}"><span class="tbox">${I.check}</span><span><b>Passed</b><small>Tick when he passes this checkpoint</small></span></button></div>`).join('')}
      </section>

      <section class="step"><h2 class="h-sec">One session, 90 minutes</h2>
        <div class="panel timeline">${T.session.map((x) => `<div class="tl-row"><b>${esc(x[0])}</b><div><strong>${esc(x[1])}.</strong> ${esc(x[2])}</div></div>`).join('')}</div>
      </section>

      <section class="step"><h2 class="h-sec">How to teach and correct</h2>
        <div class="two-col"><div class="box"><h3>Method</h3><ul>${T.method.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Correcting mistakes</h3><ul>${T.correcting.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>
      </section>

      <section class="step"><h2 class="h-sec">Sounds that are hard for Tajik and Russian speakers</h2>
        <div class="panel scroll-x"><table class="sound-table"><thead><tr><th>Sound</th><th>Examples</th><th>How to drill it</th><th></th></tr></thead><tbody>
          ${T.sounds.map((x) => `<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${playBtn(x[1].replace(/\//g, ','), 'y', null, true, 'Listen to the examples')}</td></tr>`).join('')}
        </tbody></table></div>
      </section>

      <section class="step"><h2 class="h-sec">Grammar in 10 patterns</h2>
        <p style="color:var(--muted)">Teach each one as a slot to fill, never as a rule to explain.</p>
        <div class="panel scroll-x"><table class="sound-table"><thead><tr><th>Pattern</th><th>Use it for</th><th>Examples</th></tr></thead><tbody>
          ${T.grammar.map((x) => `<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="notice">${I.info}<span>${esc(T.articles)}</span></div>
      </section>

      <section class="step"><h2 class="h-sec">The roadside English check</h2>
        <div class="box"><ul>${T.elp.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>

  /* dictionary */

  /* ---------------- tests ---------------- */
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; };
  const normT = (s) => nm(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const SIGN_TWINS = [['doNotEnter', 'wrongWay'], ['noParking', 'towZone', 'loading'], ['weigh', 'trucksExit'], ['schoolZone', 'speedSchool'], ['crossbuck', 'rrAhead'], ['stop', 'stopAhead'], ['laneEnds', 'laneClosed', 'merge'], ['exitGuide', 'exitOnly'], ['slippery', 'bridgeIces']];
  const twins = (id) => { const g = SIGN_TWINS.find((x) => x.indexOf(id) >= 0); return g || [id]; };
  const ALL_SIGNS = Object.keys(window.SIGNS).filter((k) => k !== 'street');
  // pick n items, spreading them over as many lessons as possible
  function spread(items, n) {
    const groups = {};
    shuffle(items).forEach((it) => { const k = it.l ? it.l.id : 'x'; (groups[k] = groups[k] || []).push(it); });
    const lists = shuffle(Object.keys(groups).map((k) => groups[k]));
    const out = [];
    while (out.length < n && lists.some((g) => g.length)) lists.forEach((g) => { if (g.length && out.length < n) out.push(g.shift()); });
    return out;
  }
  function mcq(correct, pool, n) {
    const seen = {}; seen[normT(correct)] = 1;
    const d = [];
    shuffle(pool).forEach((x) => { const k = normT(x); if (!seen[k] && d.length < n - 1) { seen[k] = 1; d.push(x); } });
    const o = shuffle([correct].concat(d));
    return { o, a: o.indexOf(correct) };
  }
  function bankOf(lessons) {
    const B = { reply: [], ears: [], say: [], phrase: [], signs: [] };
    lessons.forEach((l) => {
      l.lines.forEach((ln, i) => { const nx = l.lines[i + 1]; if (ln[0] !== 'y' && nx && nx[0] === 'y' && ln[1].length > 14 && !/(this one|this sign|that one|under it)\?$/i.test(ln[1])) B.reply.push({ l, said: ln[1], who: ln[0], ans: nx[1] }); });
      l.ears.forEach((e) => B.ears.push({ l, e }));
      l.say.forEach((x) => B.say.push({ l, cue: x[0], ans: x[1] }));
      l.phrases.forEach((x) => B.phrase.push({ l, en: x[0], ru: x[1], tj: x[2] }));
      if (l.read.kind === 'signs') l.read.ids.forEach((id) => { if (B.signs.indexOf(id) < 0) B.signs.push(id); });
    });
    return B;
  }
  const ALLB = bankOf(LESSONS);
  const others = (it, list, key, wide) => { let p = list.filter((x) => x.l !== it.l).map((x) => x[key]); if (p.length < 6) p = wide.filter((x) => x.l !== it.l).map((x) => x[key]); return p; };
  const Q = {
    reply: (it, B) => Object.assign({ type: 'reply', kind: 'Listen', title: 'Listen. What is the best answer?', audio: { text: it.said, who: it.who, lesson: it.l }, from: it.l }, mcq(it.ans, others(it, B.reply, 'ans', ALLB.reply), 3)),
    ears: (it) => { const o = shuffle(it.e.o); return { type: 'ears', kind: 'Listen', title: it.e.q, audio: { text: it.e.say, who: 't', lesson: it.l }, o, a: o.indexOf(it.e.o[it.e.a]), from: it.l }; },
    say: (it, B) => Object.assign({ type: 'say', kind: 'What do you say?', title: 'What do you say?', cue: it.cue, from: it.l }, mcq(it.ans, others(it, B.say, 'ans', ALLB.say), 3)),
    phrase: (it, B) => Object.assign({ type: 'phrase', kind: 'Meaning', title: 'Which English phrase means this?', tr: [it.ru, it.tj], from: it.l }, mcq(it.en, others(it, B.phrase, 'en', ALLB.phrase), 3)),
    sign: (id) => { const tw = twins(id); return Object.assign({ type: 'sign', kind: 'Road sign', title: 'What does this sign mean?', sign: id }, mcq(window.SIGNS[id].mean, ALL_SIGNS.filter((k) => tw.indexOf(k) < 0).map((k) => window.SIGNS[k].mean), 3)); }
  };
  function mixQs(B, plan) {
    let qs = [];
    Object.keys(plan).forEach((type) => {
      if (type === 'sign') shuffle(B.signs.length ? B.signs : ALL_SIGNS).slice(0, plan.sign).forEach((id) => qs.push(Q.sign(id)));
      else spread(B[type], plan[type]).forEach((it) => qs.push(Q[type](it, B)));
    });
    return shuffle(qs);
  }
  const TESTS = UNITS.map((u) => {
    const signUnit = u.lessons.every((l) => l.read.kind === 'signs');
    return { id: 'u' + u.n, unit: u, pass: 0.8, n: 12, badge: () => window.shieldSVG(u.n), title: `Unit ${u.n}: ${u.title}`,
      desc: signUnit ? 'Ten road signs and two quick conversations from this unit.' : 'Listening, answers and phrases from the lessons in this unit.',
      make() { const B = bankOf(u.lessons); return signUnit ? mixQs(B, { sign: 10, reply: 2 }) : mixQs(B, B.signs.length ? { reply: 5, ears: 3, say: 2, phrase: 1, sign: 1 } : { reply: 5, ears: 3, say: 2, phrase: 2 }); } };
  }).concat([
    { id: 'signs', pass: 0.85, n: 20, title: 'Road sign test', badge: () => window.signSVG('curve'), desc: 'Twenty signs from the whole book. Say the meaning out loud first, then choose.', make: () => shuffle(ALL_SIGNS).slice(0, 20).map((id) => Q.sign(id)) },
    { id: 'roadside', pass: 'check', n: 11, title: 'Roadside English check', badge: () => window.signSVG('weigh'), desc: 'Like the real check for truck drivers: an officer asks seven questions (listen, no text) and shows four signs. Pass = 6 of 7 answers and 3 of 4 signs.',
      make() {

        const talk = spread(B.reply.filter((x) => ['inspection', 'trafficstop', 'weigh'].indexOf(x.l.id) >= 0), 7).map((it) => Object.assign(Q.reply(it, B), { part: 'talk' }));
        const signs = shuffle(byId('signtest').read.ids).slice(0, 4).map((id) => Object.assign(Q.sign(id), { part: 'sign' }));
        return talk.concat(signs);
      } },
    { id: 'mix', pass: null, n: 10, title: 'Quick mix', badge: () => window.signSVG('interstate'), desc: 'Ten questions from the lessons you covered together. Good for a five-minute warm-up.',
      make() { const done = LESSONS.filter((l) => prog(l.id).t); const B = bankOf(done.length >= 3 ? done : LESSONS); return mixQs(B, { reply: 4, ears: 2, say: 2, phrase: 2 }); } }
  ]);
  const testById = (id) => TESTS.find((t) => t.id === id);
  const testPassed = (t) => !!(S.tests[t.id] && S.tests[t.id].ok);

  function pageTests() {

    };
    return `
      <div class="sign-wrap"><span class="exit-tab">TESTS</span>

      <section class="step"><h2 class="h-sec">Unit tests</h2><div class="tests-grid">${TESTS.filter((t) => t.unit).map(card).join('')}</div></section>

      <section class="step"><h2 class="h-sec">Grammar, verbs and slang</h2><p style="color:var(--muted)">Each grammar topic ends with its own test. The verb and slang tests give new questions every time.</p>
        <div class="mini-tests">${[{ id: 'verbs', t: 'Verb forms: 10 irregular verbs', href: '#verbs:test', ic: I.verbs }, { id: 'slang', t: 'Slang: what does it mean?', href: '#slang:test', ic: I.slang }].concat(window.GRAMMAR.map((g, i) => ({ id: 'g-' + g.id, t: `Grammar ${i + 1}: ${g.title}`, href: `#grammar-${g.id}:test`, ic: I.gram }))).map((x) => { const r = S.tests[x.id]; return `<a class="mtest ${r && r.ok ? 'passed' : ''}" href="${x.href}"><span class="mt-ic">${x.ic}</span><span class="mt-t">${esc(x.t)}</span><span class="mt-s">${r ? `${r.ok ? I.check : ''}${r.best}/${r.total}` : '—'}</span></a>`; }).join('')}</div></section>`;
  }

  let TR = null;
  function pageTestRun(t) {
    TR = { t, qs: t.make(), i: 0, ans: [] };
    return `<div class="sign-wrap"><span class="exit-tab">TEST</span><header class="guide"><h1>${esc(t.title)}</h1><p class="where">${I.test}<span>${esc(t.desc)}</span></p></header></div><div id="trun" class="trun"></div>`;
  }
  function tqHTML(q, i, n) {
    let body = '';
    if (q.audio) body += `<div class="tq-audio">${playBtn(q.audio.text, q.audio.who, q.audio.lesson, false, 'Play the question')}<button class="btn small ghost" data-act="tshow">${I.eye}Show the text</button><div class="tq-said" hidden>“${E(q.audio.text)}”</div></div>`;
    if (q.cue) body += `<div class="tq-cue">${E(q.cue)}</div>`;
    if (q.tr) body += `<div class="tq-cue tq-tr"><span lang="${S.lang === 'tj' ? 'tg' : 'ru'}">${E(S.lang === 'tj' ? q.tr[1] : q.tr[0])}</span><small>${S.lang === 'tj' ? 'Tajik' : 'Russian'}</small></div>`;

        <div class="opts">${q.o.map((o, k) => `<button class="opt" data-act="topt" data-i="${k}"><span class="k">${'ABCD'[k]}</span><span>${E(o)}</span></button>`).join('')}</div>

  function renderTQ(autoplay) {
    const box = $('#trun'); if (!box || !TR) return;

  }
  function resultHTML() {
    const t = TR.t, n = TR.qs.length;
    const ok = TR.ans.filter((a, i) => a === TR.qs[i].a).length;
    let passed, note;
    if (t.pass === 'check') {
      const part = (p) => TR.qs.map((q, i) => ({ q, i })).filter((x) => x.q.part === p);
      const talk = part('talk'), sg = part('sign');
      const tOk = talk.filter((x) => TR.ans[x.i] === x.q.a).length, sOk = sg.filter((x) => TR.ans[x.i] === x.q.a).length;
      passed = tOk >= talk.length - 1 && sOk >= 3;
      note = `Questions: ${tOk} of ${talk.length} · Signs: ${sOk} of ${sg.length}. ${passed ? 'He would pass this check.' : 'Not yet: he needs 6 of 7 answers and 3 of 4 signs.'}`;
    } else if (t.pass) { passed = ok / n >= t.pass; note = passed ? 'Passed. Move on to the next unit.' : `Not yet. ${Math.ceil(t.pass * n)} of ${n} needed. Repeat the lessons with mistakes, then try again.`; }

      S.tests[t.id] = { best: Math.max(prev.best || 0, ok), total: n, last: ok, at: Date.now(), tries: (prev.tries || 0) + 1, ok: !!(prev.ok || passed) };

        return `<div class="miss-row">${q.sign ? `<span class="miss-sign">${window.signSVG(q.sign)}</span>` : ''}<div><span class="tq-kind">${esc(q.kind)}</span><div class="miss-q">${E(q.title)} ${ctx ? `<span>${ctx}</span>` : ''}</div>
          <div class="miss-a">${I.check}<span>${E(q.o[q.a])}</span>${playBtn(q.o[q.a], 'y', q.from || null, true, 'Listen to the answer')}</div>
          ${q.from ? `<a class="miss-l" href="#lesson-${q.from.id}">Lesson ${lnum(q.from)}: ${esc(q.from.title)}</a>` : ''}</div></div>`;
      }).join('')}</div></section>` : ''}
      <div class="pager"><a class="btn" href="#tests">${I.left}All tests</a><button class="btn primary" data-act="tagain">${I.shuffle}Try again with new questions</button></div>`;
  }

  /* ---------------- reference pages: grammar, verb forms, slang, translator ---------------- */
  // Text in the active language (Russian or Tajik). CSS shows one of the two, so switching needs no re-render.
  const rt = (ru, tj) => `<span class="rt rt-ru" lang="ru">${E(ru)}</span><span class="rt rt-tj" lang="tg">${E(tj)}</span>`;
  const md = (s) => E(s).replace(/\*([^*]+)\*/g, '<b class="en-in" lang="en">$1</b>');
  const rtMd = (ru, tj) => `<p class="rt rt-ru" lang="ru">${md(ru)}</p><p class="rt rt-tj" lang="tg">${md(tj)}</p>`;
  const langSwitch = () => `<div class="seg lang-sw" role="group" aria-label="Language of explanations"><button data-act="setlang" data-lang="ru" aria-pressed="${S.lang !== 'tj'}">Русский</button><button data-act="setlang" data-lang="tj" aria-pressed="${S.lang === 'tj'}">Тоҷикӣ</button></div>`;
  const refHead = (tab, title, icon, sub) => `<div class="sign-wrap"><span class="exit-tab">${esc(tab)}</span><header class="guide"><h1>${esc(title)}</h1><p class="where">${icon}<span>${sub}</span></p></header></div>`;

  /* scores for grammar, verb and slang tests (saved and synced like the other tests) */
  function saveScore(id, ok, total, pass) {

    },
    setlang(t) {
      S.lang = t.dataset.lang === 'tj' ? 'tj' : 'ru'; save('lang'); applyBodyClasses(); renderTop($('.top-title').textContent);
      $$('[data-act="setlang"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
      if ($('#tx-q') && TX.last) txGo();
    },
    rqagain(t) { const id = t.dataset.id; const box = t.closest('.rquiz'); if (box && RQ[id]) { box.outerHTML = refQuiz(id); } },
    vfilter(t) { VS.f = t.dataset.f; $$('[data-act="vfilter"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.f === VS.f)); renderVerbList(); },
    vhide(t) { VS.hide = !VS.hide; t.setAttribute('aria-pressed', VS.hide); t.innerHTML = VS.hide ? `${I.eye}Show all forms` : `${I.eyeOff}Hide V2 and V3`; renderVerbList(); },
    vpeek(t) { if (VS.hide) t.classList.toggle('peek'); },
    vstar(t) { const k = t.dataset.k; setVal('l|' + k, !S.learned[k]); t.setAttribute('aria-pressed', !!S.learned[k]); },
    scat(t) { SLS.cat = t.dataset.c; $$('[data-act="scat"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.c === SLS.cat)); renderSlangList(); },
    translator() {
      let pre = '';
      try { pre = String(window.getSelection ? window.getSelection() : '').replace(/\s+/g, ' ').trim(); } catch (e) { pre = ''; }
      if (pre.length > 80) pre = '';
      openTranslator(pre);
      const inp = $('#tx-q'); if (inp && !pre) inp.focus();
    },
    txgo() { txGo(); },
    txhist(t) { const inp = $('#tx-q'); if (inp) { inp.value = t.dataset.q; txGo(); } },
    txpaste() {
      const inp = $('#tx-q');
      const fail = () => { if (inp) inp.focus(); toast('Long-press the box and choose Paste.'); };
      try { navigator.clipboard.readText().then((v) => { if (inp && v && v.trim()) { inp.value = v.trim().slice(0, 200); txGo(); } else fail(); }, fail); } catch (e) { fail(); }
    },
    txaudio(t) { try { const a = new Audio(t.dataset.src); TTS.stop(); a.play().catch(() => toast('This recording could not play. Use Listen instead.')); } catch (e) { toast('This recording could not play. Use Listen instead.'); } },
    sayslow(t) { const r = REG[t.dataset.k]; if (!r) return; const old = S.rate; S.rate = 0.6; TTS.speak(r.text, 'y', null); S.rate = old; },
    signflip(t) { const c = t.closest('.sign-card'); c.classList.toggle('open'); if (c.classList.contains('open')) A.say(t); },
    reveal(t) { const c = t.closest('.say-card'); c.classList.add('open'); t.hidden = true; const p = $('.play', c); if (p) A.say(p); },
    mic(t) { const r = REG[t.dataset.k]; const host = t.closest('.card, .say-card, .rp-box, .tx-card'); const out = host ? $('.heard', host) : null; if (r && out) listen(t, r.text, out); },
    tr() { S.tr = !S.tr; save('tr'); applyBodyClasses(); renderTop($('.top-title').textContent); },
    lang(t) { S.lang = t.dataset.lang; S.tr = true; save('lang'); save('tr'); applyBodyClasses(); renderTop($('.top-title').textContent); $$('[data-act="setlang"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === S.lang)); },
    teach() { S.teacher = !S.teacher; save('teacher'); applyBodyClasses(); renderTop($('.top-title').textContent); toast(S.teacher ? 'Teacher notes shown.' : 'Teacher notes hidden.'); },
    theme() { S.theme = isDark() ? 'light' : 'dark'; save('theme'); applyBodyClasses(); renderTop($('.top-title').textContent); },
    menu() { document.body.classList.toggle('nav-open'); },
    settings() { openSettings(); },
    share() { openShare(); },
    syncon() {
      const url = ($('#sy-url').value || '').trim(), code = ($('#sy-code').value || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (!/^https:\/\/[^\s/]+\.[^\s]+/.test(url)) { toast('Paste the database URL. It starts with https://'); return; }
      if (code.length < 6) { toast('The class code must have at least 6 letters or numbers.'); return; }
      setSync(url, code); openShare();
      syncNow().then(() => { if ($('#sync-state')) openShare(); refreshProgressUI(); });
    },
    syncoff() { setSync(SY.url, ''); closeModal(); renderSide(CURH); toast('Sync is off on this device. Progress stays here.'); },
    syncnow() { syncNow(); },
    newcode() { const c = $('#sy-code'); if (c) c.value = newCode(); },
    copyrules() {
      const v = window.TEACHER.sync.rules;
      try { navigator.clipboard.writeText(v).then(() => toast('Rules copied.'), () => toast('Select the rules and copy them.')); } catch (e) { toast('Select the rules and copy them.'); }
    },
    copyjoin() {
      const el = $('#join-out'); const v = el.value;
      const fallback = () => { el.focus(); el.select(); toast('Press Ctrl+C (or Copy) to copy the link.'); };
      try { navigator.clipboard.writeText(v).then(() => toast('Invite link copied.'), fallback); } catch (e) { fallback(); }
    },
    'modal-close'() { closeModal(); },
    copycode() {
      const ta = $('#code-out'); const v = ta.value;
      const fallback = () => { ta.focus(); ta.select(); toast('Press Ctrl+C (or Copy) to copy the selected code.'); };
      try { navigator.clipboard.writeText(v).then(() => toast('Code copied.'), fallback); } catch (e) { fallback(); }
    },
    loadcode() { loadCode(); },
    'test-voice'() {
      readSettingsForm();
      const demo = byId('pickup');
      TTS.speak("Hi, I'm here for a pickup. DoorDash.", 'y', demo, () => TTS.speak('Hey! Name on the order?', 't', demo));
    },
    'save-settings'() {
      const name = ($('#set-name').value || '').trim() || 'Ali';
      readSettingsForm(); if (name !== S.name) setVal('n', name);
      save('rate'); save('voiceYou'); save('voiceOther'); closeModal(); route(); toast('Settings saved.');
    },
    reset(t) {
      if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Click again to clear everything'; t.style.borderColor = 'var(--star)'; t.style.color = 'var(--star)'; return; }
      const now = Date.now();
      Object.keys(S.ts).forEach((k) => { if (k !== 'n') { writeKey(k, false); S.ts[k] = now; } });
      saveProgress(); queueSync(); closeModal(); route(); toast('All ticks, checkpoints and stars cleared.');
    },
    dcat(t) { DS.cat = t.dataset.c; DS.fc = 0; DS.order = null; DS.flipped = false; $$('.fchip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.c === DS.cat)); renderDictList(); },
    dmode(t) { DS.mode = t.dataset.m; DS.fc = 0; DS.flipped = false; $$('[data-act="dmode"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === DS.mode)); renderDictList(); },
    dtest(t) { DS.test = !DS.test; t.setAttribute('aria-pressed', DS.test); renderDictList(); },
    dpeek(t) { const r = t.closest('.drow'); if (r) r.classList.toggle('peek'); },
    dstar(t) { const k = t.dataset.en; setVal('l|' + k, !S.learned[k]); t.setAttribute('aria-pressed', !!S.learned[k]); const sc = $('#dlist .score:last-child'); if (sc && DS.mode === 'list') sc.textContent = `${dictItems().length} shown, ${Object.keys(S.learned).filter((k) => k.indexOf('verb:') !== 0).length} starred`; },
    'fc-flip'() { DS.flipped = !DS.flipped; renderDictList(); },
    'fc-next'() { const n = dictItems().length; DS.fc = (DS.fc + 1) % n; DS.flipped = false; renderDictList(); },
    'fc-prev'() { const n = dictItems().length; DS.fc = (DS.fc - 1 + n) % n; DS.flipped = false; renderDictList(); },
    'fc-shuffle'() { const n = dictItems().length; const o = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } DS.order = o; DS.fc = 0; DS.flipped = false; renderDictList(); toast('Cards shuffled.'); }
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) { if (document.body.classList.contains('nav-open') && !e.target.closest('.side') && !e.target.closest('.menu-btn')) document.body.classList.remove('nav-open'); return; }
    const f = A[t.dataset.act];
    if (f) { if (t.tagName === 'A') e.preventDefault(); f(t, e); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); document.body.classList.remove('nav-open'); TTS.stop(); }
  });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) renderTop($('.top-title').textContent); }); } catch (e) { /* old browser */ } }
  window.addEventListener('hashchange', route);

  /* ---------------- boot ---------------- */
  applyBodyClasses();
  TTS.init();
  route();
  if (SY.joined) toast('This device now shares progress with class ' + SY.code + '.');
  syncNow();
  setInterval(() => { if (document.visibilityState !== 'hidden') syncNow(); }, 60000);
  setInterval(paintSync, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); else if (SY.timer) { clearTimeout(SY.timer); SY.timer = null; syncNow(); } });
  window.addEventListener('online', () => syncNow());
})();

</script>
</body>
</html>
