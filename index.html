:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: a fixed "route map" sidebar on the left, one reading column on the right.
   Every lesson opens under a green highway guide sign with an EXIT tab; teacher notes are yellow warning-sign panels. */
:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --surface-2: #E7ECF4;
  --ink: #121A2B;
  --muted: #536079;
  --line: #D0D8E5;
  --sign: #1F3F8F;
  --sign-2: #183273;
  --on-sign: #FFFFFF;
  --sign-ink: #1F3F8F;
  --warn: #F5B700;
  --warn-soft: #FFF5D1;
  --warn-ink: #3B2C00;
  --lake: #1A86BF;
  --lake-soft: #E2F1FA;
  --lake-ink: #0B5A84;
  --star: #D21F3C;
  --star-soft: #FDE7EA;
  --ok: #17834F;
  --ok-soft: #DDF3E6;
  --you: #1A86BF;
  --them: #1F3F8F;
  --third: #9A6400;
  --focus: #1A86BF;
  --shadow: 0 1px 2px rgba(18, 26, 43, .07), 0 8px 24px rgba(18, 26, 43, .06);

  --f-sign: 'Overpass', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Overpass', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-tr: 'PT Sans', 'Segoe UI', Roboto, Arial, sans-serif;

  --sc-sky: #CFE6F2;
  --sc-sky-2: #E8F3F8;
  --sc-night: #1D2C3D;
  --sc-far: #A7C1CE;
  --sc-mid: #8AA6B5;
  --sc-ground: #D7DDDA;
  --sc-road: #4D5653;
  --sc-mark: #F6F6EF;
  --sc-brick: #B5533A;
  --sc-brick-d: #8F402B;
  --sc-stone: #E7E0D3;
  --sc-wall: #EFE9DF;
  --sc-wall-2: #DDD4C5;
  --sc-floor: #CDBB9F;
  --sc-glass: #A3D5EC;
  --sc-dark: #25312C;
  --sc-white: #FFFFFF;
  --sc-wood: #9A6B43;
  --sc-skin-a: #C68B59;
  --sc-skin-b: #8D5A3B;
  --sc-skin-c: #EBC39F;
  --sc-hair: #2A211C;
  --sc-snow: #FFFFFF;
  --sc-shade: rgba(19, 32, 26, .12);
}

    --you: #47AFE3; --them: #7C9DEB; --third: #F0B649; --focus: #47AFE3;

    --sc-sky: #1E3141; --sc-sky-2: #253B4D; --sc-night: #0E1824; --sc-far: #304859; --sc-mid: #3C566A;

  }
}

  --bg: #0D121B; --surface: #141B27; --surface-2: #1B2433; --ink: #E5EBF5; --muted: #9AA7BC; --line: #2A3547;
  --sign: #2B53B0; --sign-2: #22468F; --on-sign: #FFFFFF; --sign-ink: #9DB8F7;
  --warn: #F5B700; --warn-soft: #2D2611; --warn-ink: #FFE291;
  --lake: #47AFE3; --lake-soft: #132A3A; --lake-ink: #94D2F2;
  --star: #FF5A6D; --star-soft: #3A1820; --ok: #3CC27E; --ok-soft: #12301F;
  --you: #47AFE3; --them: #7C9DEB; --third: #F0B649; --focus: #47AFE3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  --sc-sky: #1E3141; --sc-sky-2: #253B4D; --sc-night: #0E1824; --sc-far: #304859; --sc-mid: #3C566A;
  --sc-ground: #29312E; --sc-road: #1C2220; --sc-mark: #C8CEC8; --sc-brick: #86402F; --sc-brick-d: #693022;
  --sc-stone: #4B463E; --sc-wall: #2E2B26; --sc-wall-2: #3A362F; --sc-floor: #4A3F31; --sc-glass: #3C6F89;

  color-scheme: dark;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--surface);
}
h1, h2, h3, h4 { font-family: var(--f-sign); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--lake-ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg { display: block; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 18px 16px 28px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); padding: 4px 6px; }
.brand-mark { width: 46px; height: 46px; flex: none; }
.brand-name, .brand-sub { display: block; }
.brand-name { font-family: var(--f-sign); font-weight: 900; font-size: 19px; line-height: 1.05; letter-spacing: -.01em; }
.brand-sub { font-size: 12.5px; color: var(--muted); line-height: 1.3; margin-top: 3px; }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15.5px;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item[aria-current="page"] { background: var(--sign); color: var(--on-sign); }
.nav-item[aria-current="page"] .nav-ico { color: var(--on-sign); }
.nav-ico { width: 22px; height: 22px; color: var(--sign-ink); flex: none; }
.nav-count { margin-left: auto; font-size: 12.5px; font-weight: 700; opacity: .8; font-variant-numeric: tabular-nums; }

.toc { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 10px; padding-left: 12px; border-left: 2px solid var(--line); }
.nav-toggle { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; }
.nav-toggle.here { background: var(--surface-2); }
.nav-item .chev, .toc-unit .chev { width: 18px; height: 18px; flex: none; color: var(--muted); transition: transform .2s ease; }
.nav-item .chev svg, .toc-unit .chev svg { width: 100%; height: 100%; }
.nav-toggle .nav-count { margin-left: auto; }
.nav-group:not(.open) .nav-toggle .chev, .toc-u:not(.open) .toc-unit .chev { transform: rotate(-90deg); }
.toc-u { display: grid; }
.toc-unit {
  display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; cursor: pointer;
  padding: 7px 8px; border-radius: 8px; text-align: left; line-height: 1.25;
  font-family: var(--f-sign); font-weight: 800; font-size: 13.5px; color: var(--ink);
}
.toc-unit:hover { background: var(--surface-2); }
.toc-un { width: 22px; height: 22px; border-radius: 6px; background: var(--sign); color: var(--on-sign); display: grid; place-items: center; font-size: 12px; flex: none; }
.toc-ut { flex: 1; min-width: 0; }
.toc-uc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc-uc.full { color: var(--ok); }
.toc-ls { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 8px 8px; }
.toc-over .toc-num { display: grid; place-items: center; }
.toc-over .toc-num svg { width: 16px; height: 16px; color: var(--sign-ink); }
.toc-link {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.3;
}
.toc-link:hover { background: var(--surface-2); }
.toc-link[aria-current="page"] { background: var(--lake-soft); color: var(--lake-ink); font-weight: 700; }
.toc-num { font-family: var(--f-sign); font-weight: 800; font-size: 12px; color: var(--muted); width: 26px; flex: none; font-variant-numeric: tabular-nums; }
.toc-ticks { margin-left: auto; display: flex; gap: 3px; flex: none; }
.tdot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.tdot.t.on { background: var(--warn); border-color: var(--warn); }
.tdot.s.on { background: var(--lake); border-color: var(--lake); }

.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.meter { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.meter-row { display: grid; grid-template-columns: 1fr auto; font-size: 13px; color: var(--muted); gap: 4px 10px; align-items: center; }
.meter-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; }
.bar.t > i { background: var(--warn); }
.bar.s > i { background: var(--lake); }
.bar.x > i { background: var(--sign-ink); }

.sync-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); line-height: 1.25;
}
.sync-btn:hover { background: var(--surface-2); }
.sync-btn b { display: block; font-size: 14px; }
.sync-btn small { display: block; font-size: 12px; color: var(--muted); }
.sync-btn > svg { width: 18px; height: 18px; margin-left: auto; color: var(--muted); flex: none; }
.sdot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.ok .sdot { background: var(--ok); }
.err .sdot { background: var(--star); }
.busy .sdot { background: var(--lake); animation: pulse 1s ease-in-out infinite; }
.off .sdot { background: transparent; border: 2px solid var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }
.sync-state { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin: 4px 0 14px; }
.sync-state .sdot { margin-top: 7px; }
.sync-state b { display: block; }
.sync-state small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.sync-state.err { background: var(--star-soft); }
.sync-state.ok { background: var(--ok-soft); }
.copy-row { display: flex; gap: 8px; }
.copy-row input { flex: 1; min-width: 0; }
.m-lead { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
details.manual { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
details.manual summary { cursor: pointer; font-weight: 700; font-size: 14.5px; color: var(--lake-ink); }
details.manual p { color: var(--muted); font-size: 14px; margin: 8px 0; }
details.manual .field-row { margin-top: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: none; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--on-sign); }
.btn.primary:hover { background: var(--sign-2); }
.btn.lake { background: var(--lake); border-color: var(--lake); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13.5px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Top bar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top-title { font-family: var(--f-sign); font-weight: 800; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 140px; }
.menu-btn { display: none; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--lake); color: #fff; }
.seg button.tr-main[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button svg { width: 17px; height: 17px; }
.seg.off button.lang { opacity: .55; }
.icon-btn { width: 40px; height: 40px; padding: 0; }
.teach-toggle[aria-pressed="true"] { background: var(--warn); color: #241B00; border-color: var(--warn); }

/* ---------- Page ---------- */
.page {
  width: 100%; max-width: 920px; margin: 0 auto;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
.lede { font-size: 18.5px; color: var(--muted); max-width: 62ch; }
.h-page { font-size: clamp(30px, 4.4vw, 44px); font-weight: 900; letter-spacing: -.02em; }
.h-sec { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.h-sub { font-size: 18px; font-weight: 800; }

/* ---------- Guide sign (lesson + page headers) ---------- */
.sign-wrap { display: flex; flex-direction: column; align-items: flex-start; }
.exit-tab {
  background: var(--sign); color: var(--on-sign);
  font-family: var(--f-sign); font-weight: 800; font-size: 15px; letter-spacing: .04em;
  padding: 6px 14px 3px; border-radius: 8px 8px 0 0;
  box-shadow: inset 0 0 0 2.5px var(--on-sign), 0 0 0 1px var(--sign);
  margin-left: 18px; position: relative; top: 3px;
}
.guide {
  width: 100%; background: var(--sign); color: var(--on-sign);
  border-radius: 14px; padding: 22px 26px 20px;
  box-shadow: inset 0 0 0 3px var(--on-sign), 0 0 0 1.5px var(--sign), var(--shadow);
  display: grid; gap: 8px;
}
.guide h1 { font-size: clamp(28px, 4.2vw, 42px); font-weight: 900; letter-spacing: -.015em; line-height: 1.05; }
.guide .where { font-size: 16px; opacity: .92; display: flex; gap: 8px; align-items: flex-start; }
.guide .where svg { width: 18px; height: 18px; flex: none; margin-top: 3px; }
.guide .goal { font-size: 15px; background: rgba(255,255,255,.14); border-radius: 8px; padding: 6px 10px; justify-self: start; }

.scene {
  border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--sc-sky);
  aspect-ratio: 640 / 300; max-width: 100%;
}
.scene svg { width: 100%; height: 100%; }

/* ---------- Progress ticks ---------- */
.ticks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tick {
  display: flex; align-items: center; gap: 12px; text-align: left;
  border: 1.5px dashed var(--line); background: var(--surface); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; min-height: 60px;
}
.tick:hover { border-color: var(--muted); }
.tick .tbox { width: 28px; height: 28px; padding: 0; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; box-sizing: border-box; }
.tick .tbox svg { width: 18px; height: 18px; opacity: 0; }
.tick b { display: block; font-size: 15px; }
.tick small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.tick[aria-pressed="true"] { border-style: solid; }
.tick.t[aria-pressed="true"] { border-color: var(--warn); background: var(--warn-soft); }
.tick.t[aria-pressed="true"] .tbox { background: var(--warn); border-color: var(--warn); color: #241B00; }
.tick.s[aria-pressed="true"] { border-color: var(--lake); background: var(--lake-soft); }
.tick.s[aria-pressed="true"] .tbox { background: var(--lake); border-color: var(--lake); color: #fff; }
.tick[aria-pressed="true"] .tbox svg { opacity: 1; }

/* ---------- Teacher panels ---------- */
.teach { border-radius: 14px; background: var(--warn-soft); border: 2px solid var(--warn); color: var(--ink); }
.teach > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 16px;
}
.teach > summary::-webkit-details-marker { display: none; }
.diamond { width: 36px; height: 36px; flex: none; }
.teach-label { font-family: var(--f-sign); font-weight: 900; font-size: 17px; color: var(--warn-ink); }
.teach-hint { font-size: 13.5px; color: var(--muted); display: block; font-family: var(--f-body); font-weight: 400; }
.teach .chev { margin-left: auto; width: 22px; height: 22px; transition: transform .2s; color: var(--warn-ink); }
.teach[open] .chev { transform: rotate(180deg); }
.teach-body { padding: 0 18px 18px 66px; display: grid; gap: 14px; font-size: 16px; }
.teach-body h4 { font-size: 13px; letter-spacing: .06em; color: var(--warn-ink); margin-bottom: 4px; }
.teach-body ul, .teach-body ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.tip {
  display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45;
  background: var(--warn-soft); border-left: 4px solid var(--warn); padding: 8px 12px; border-radius: 0 8px 8px 0;
}
.tip b { font-family: var(--f-sign); color: var(--warn-ink); white-space: nowrap; }
body.no-teacher .teach, body.no-teacher .tip, body.no-teacher .teacher-only { display: none !important; }

/* ---------- Steps ---------- */
.step { display: grid; gap: 14px; }
.step-head { display: flex; align-items: center; gap: 12px; }
.step-num {
  width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font-family: var(--f-sign); font-weight: 900; font-size: 17px; flex: none;
}
.step-head h2 { font-size: 23px; font-weight: 800; }
.step-head p { color: var(--muted); font-size: 14.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }

/* ---------- Dialogue ---------- */
.dlg-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dlg { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.line { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
.line.y { align-self: flex-end; flex-direction: row-reverse; }
.ava {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  color: #fff; font-family: var(--f-sign); font-weight: 900; font-size: 13px; letter-spacing: .02em;
}
.line.t .ava { background: var(--them); }
.line.y .ava { background: var(--you); }
.line.x .ava { background: var(--third); }
.bub {
  position: relative; border-radius: 16px; padding: 9px 14px 10px; background: var(--surface-2);
  cursor: pointer; border: 2px solid transparent; min-width: 0; text-align: left;
}
.line.y .bub { background: var(--lake-soft); }
.bub .who { font-size: 12px; font-weight: 800; font-family: var(--f-sign); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.bub .who svg { width: 14px; height: 14px; }
.bub .en { font-size: 18px; font-weight: 500; line-height: 1.4; display: block; }
.tr { display: none; font-family: var(--f-tr); font-size: 15px; color: var(--muted); line-height: 1.4; margin-top: 3px; }
body.show-tr.lang-ru .tr-ru, body.show-tr.lang-tj .tr-tj { display: block; }
.bub.speaking { border-color: var(--lake); }
.line.y .bub.speaking { border-color: var(--you); }
.dlg.blind .bub .en, .dlg.blind .bub .tr { filter: blur(7px); user-select: none; }
.dlg.blind .bub.revealed .en, .dlg.blind .bub.revealed .tr { filter: none; }
.dlg.rp .line.future { display: none; }
.rp-box {
  display: none; margin-top: 12px; border: 2px solid var(--you); border-radius: 14px; padding: 14px; background: var(--lake-soft);
  gap: 10px;
}
.rp-box.on { display: grid; }
.rp-box .rp-say { font-size: 19px; font-weight: 600; }
.rp-box .rp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rp-label { font-family: var(--f-sign); font-weight: 900; color: var(--lake-ink); font-size: 14px; letter-spacing: .03em; }

/* ---------- Phrase cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.card .en { font-size: 18px; font-weight: 700; line-height: 1.3; }
.card .note { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
.play {
  width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--lake); color: #fff; flex: none;
}
.play:hover { filter: brightness(1.08); }
.play svg { width: 18px; height: 18px; }
.play.small { width: 32px; height: 32px; }
.play.small svg { width: 14px; height: 14px; }
.mic { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.mic.listening { background: var(--star); color: #fff; border-color: var(--star); }
.heard { font-size: 13.5px; border-radius: 8px; padding: 6px 10px; display: none; }
.heard.on { display: block; }
.heard.good { background: var(--ok-soft); color: var(--ok); }
.heard.mid { background: var(--warn-soft); color: var(--warn-ink); }
.heard.bad { background: var(--star-soft); color: var(--star); }

/* ---------- Quiz ---------- */
.quiz { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.q-top { display: flex; gap: 12px; align-items: center; }
.q-text { font-weight: 700; font-size: 17px; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 16px; display: flex; gap: 10px; align-items: center;
}
.opt:hover { border-color: var(--muted); }
.opt .k { font-family: var(--f-sign); font-weight: 900; color: var(--muted); width: 18px; flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--star); background: var(--star-soft); }
.q.done .opt { cursor: default; }
.why { display: none; font-size: 14.5px; color: var(--muted); }
.q.done .why { display: block; }
.transcript { display: none; font-size: 15px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.q.done .transcript { display: block; }
.score { font-family: var(--f-sign); font-weight: 800; color: var(--muted); font-size: 14px; }

/* ---------- Read-it artifacts ---------- */
.read-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.phone {
  background: #15201B; border-radius: 34px; padding: 12px; max-width: 320px; width: 100%; justify-self: center;
  box-shadow: var(--shadow);
}
.phone-screen { background: #F6F8F7; color: #13201A; border-radius: 24px; overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
.phone-status { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; padding: 10px 18px 6px; color: #13201A; }
.app-head { background: #1F3F8F; color: #fff; padding: 12px 16px; font-family: var(--f-sign); font-weight: 800; font-size: 16px; }
.app-head small { display: block; font-weight: 600; opacity: .85; font-size: 12px; font-family: var(--f-body); }
.app-body { padding: 12px 14px 16px; display: grid; gap: 8px; font-size: 14px; line-height: 1.35; }
.app-row { background: #fff; border: 1px solid #DCE3DF; border-radius: 12px; padding: 9px 11px; }
.app-row .lab { font-size: 11.5px; color: #5F6C66; font-weight: 700; display: block; }
.app-row.note { background: #FFF5D1; border-color: #F5D66B; }
.app-btn { background: #1F3F8F; color: #fff; text-align: center; border-radius: 12px; padding: 11px; font-weight: 800; font-family: var(--f-sign); }
.app-btn.alt { background: #fff; color: #1F3F8F; border: 1.5px solid #1F3F8F; }
.sms { padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.sms .m { max-width: 80%; padding: 8px 12px; border-radius: 16px; background: #E4E8E6; align-self: flex-start; line-height: 1.35; }
.sms .m.me { background: #1A86BF; color: #fff; align-self: flex-end; }
.sms .m.sys { background: transparent; color: #5F6C66; font-size: 12px; align-self: center; padding: 2px; }
.sms .m.warnm { background: #FDE7EA; color: #7A0F21; }
.paper {
  background: #FFFDF7; color: #1E241F; border-radius: 6px; padding: 20px 22px; box-shadow: var(--shadow);
  font-size: 14.5px; line-height: 1.5; max-width: 420px; width: 100%; justify-self: center;
  border: 1px solid #E5DDCB;
}
.paper h4 { font-family: var(--f-sign); font-size: 17px; font-weight: 900; margin-bottom: 10px; letter-spacing: .01em; }
.paper .kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 14px; }
.paper .kv dt { font-weight: 700; color: #59625C; font-size: 12.5px; padding-top: 2px; }
.paper .kv dd { margin: 0; }
.paper.ticket { background: #FFF6E0; border-top: 10px solid #D21F3C; }
.paper.receipt { font-family: 'Courier New', ui-monospace, monospace; max-width: 300px; font-size: 13.5px; border-radius: 2px; }
.paper.receipt pre { margin: 0; white-space: pre-wrap; font: inherit; }
.paper.note { background: #FFFBE6; transform: rotate(-.6deg); }
.paper.form .field { border-bottom: 1.5px solid #9AA39E; padding: 6px 0 2px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #59625C; }
.paper.form .field b { color: #1E241F; font-weight: 700; }
.paper .sample { display: inline-block; font-size: 11px; font-weight: 800; color: #8F402B; border: 1.5px solid #8F402B; border-radius: 4px; padding: 1px 6px; margin-bottom: 8px; }
.paper ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.idcard {
  width: 100%; max-width: 340px; aspect-ratio: 1.586; justify-self: center; border-radius: 14px; padding: 14px 16px;
  background: linear-gradient(135deg, #DCEEF7, #F3F7FA 60%, #E2EFE6); color: #13201A; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; font-size: 12.5px; position: relative; border: 1px solid #C9D7DE;
}
.idcard .idt { grid-column: 1 / -1; font-family: var(--f-sign); font-weight: 900; font-size: 14px; color: #0B5A84; display: flex; justify-content: space-between; }
.idcard .photo { background: #B9C7CF; border-radius: 6px; grid-row: span 4; display: grid; place-items: center; }
.idcard .photo svg { width: 60px; height: 60px; }
.idcard .lab { font-size: 10px; color: #56645E; font-weight: 700; display: block; }
.panel-buzz { background: #3B3F3D; color: #EEE; border-radius: 12px; padding: 14px; max-width: 300px; justify-self: center; width: 100%; display: grid; gap: 8px; box-shadow: var(--shadow); }
.panel-buzz .bz { display: flex; align-items: center; justify-content: space-between; background: #2A2D2C; border-radius: 8px; padding: 8px 12px; font-size: 14.5px; }
.panel-buzz .bz i { width: 20px; height: 20px; border-radius: 50%; background: #C9CFCB; border: 3px solid #8C928F; display: block; }
.panel-buzz .grill { height: 44px; border-radius: 8px; background: repeating-linear-gradient(90deg, #2A2D2C 0 4px, #555A57 4px 7px); }
.panel-buzz .lbl { font-size: 12px; color: #BFC6C2; text-align: center; }

.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.sign-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.sign-card svg { width: 110px; height: 110px; }
.sign-card .mean { font-size: 14px; line-height: 1.4; display: none; }
.sign-card.open .mean { display: block; }
.sign-card .sname { font-family: var(--f-sign); font-weight: 800; font-size: 13px; color: var(--muted); }

/* ---------- Say-it cards ---------- */
.say { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.say-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.say-cue { font-size: 16px; font-weight: 600; }
.say-ans { display: none; gap: 8px; }
.say-card.open .say-ans { display: grid; }
.say-ans .en { font-size: 18px; font-weight: 700; color: var(--lake-ink); }

/* ---------- Book home ---------- */
.hero {
  border-radius: 20px; overflow: hidden; background: var(--sign); color: var(--on-sign);
  box-shadow: inset 0 0 0 3px var(--on-sign), 0 0 0 1.5px var(--sign), var(--shadow);
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
}
.hero-text { padding: 28px 28px 26px; display: grid; gap: 12px; align-content: center; }
.hero-text h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
.hero-text p { font-size: 17px; opacity: .92; max-width: 44ch; }
.hero-art { background: var(--sc-sky); min-height: 220px; display: flex; align-items: flex-end; }
.hero-art svg { width: 100%; height: 100%; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero .btn { border-color: var(--on-sign); }
.hero .btn.white { background: #fff; color: #183273; }
.hero .btn.primary { background: transparent; color: #fff; }
.hero .btn.primary:hover { background: rgba(255,255,255,.12); }
.unit { display: grid; gap: 14px; }
.unit-head { display: flex; align-items: center; gap: 14px; }
.shield { width: 52px; height: 56px; flex: none; }
.unit-head h2 { font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.unit-head p { color: var(--muted); font-size: 15px; }
.unit-side { margin-left: auto; display: grid; justify-items: end; gap: 6px; flex: none; }
.unit-side .unit-prog { margin-left: 0; }
.unit-test {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; text-decoration: none; white-space: nowrap;
  color: var(--sign-ink); border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 11px;
}
.unit-test:hover { background: var(--surface-2); }
.unit-test svg { width: 15px; height: 15px; }
.unit-prog { margin-left: auto; font-family: var(--f-sign); font-weight: 800; font-size: 13.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.lcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--ink);
  display: flex; flex-direction: column;
}
.lcard:hover { border-color: var(--sign); }
.lcard .thumb { aspect-ratio: 640/300; background: var(--sc-sky); }
.lcard .thumb svg { width: 100%; height: 100%; }
.lcard .lc-body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.lcard .lc-num { font-family: var(--f-sign); font-weight: 900; font-size: 12.5px; color: var(--sign-ink); letter-spacing: .04em; }
.lcard h3 { font-size: 18px; font-weight: 800; }
.lcard .lc-ticks { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.chip.t.on { background: var(--warn); color: #241B00; }
.chip.s.on { background: var(--lake); color: #fff; }
.chip svg { width: 12px; height: 12px; }

/* ---------- Teacher page ---------- */
.week-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.week-table th, .week-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.week-table th { font-family: var(--f-sign); font-size: 13px; color: var(--muted); font-weight: 800; }
.week-table a { font-weight: 600; }
.wk-l { display: flex; align-items: center; gap: 8px; }
.wk-l .toc-ticks { margin-left: 0; }
.scroll-x { overflow-x: auto; }
.cp { display: flex; gap: 12px; align-items: flex-start; }
.cp .tick { flex: 1; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; }
.box h3 { font-size: 18px; font-weight: 800; }
.box ul, .box ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.prose { display: grid; gap: 12px; max-width: 70ch; }
.sound-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.sound-table td, .sound-table th { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.sound-table th { font-family: var(--f-sign); font-size: 13px; color: var(--muted); }
.timeline { display: grid; gap: 0; }
.tl-row { display: grid; grid-template-columns: 80px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tl-row b { font-family: var(--f-sign); font-weight: 900; color: var(--sign-ink); font-variant-numeric: tabular-nums; }

/* ---------- Resources ---------- */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.res {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px;
  text-decoration: none; color: var(--ink); align-content: start;
}
.res:hover { border-color: var(--lake); }
.res .rtype { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--lake-ink); font-family: var(--f-sign); }
.res .rtype svg { width: 16px; height: 16px; }
.res h3 { font-size: 17px; font-weight: 800; }
.res p { font-size: 14.5px; color: var(--muted); }
.res .how { font-size: 13.5px; color: var(--ink); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.res .host { font-size: 12.5px; color: var(--muted); word-break: break-all; }

/* ---------- Dictionary ---------- */
.dict-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; min-height: 46px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); width: 100%; min-height: 44px; }
.search:focus-within { border-color: var(--focus); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; min-height: 34px; }
.fchip[aria-pressed="true"] { background: var(--sign); color: var(--on-sign); border-color: var(--sign); }
.dict { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.drow { display: grid; grid-template-columns: 40px minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.drow:last-child { border-bottom: 0; }
.drow.head { background: var(--surface-2); font-family: var(--f-sign); font-weight: 800; font-size: 12.5px; color: var(--muted); padding-block: 8px; }
.drow .den { font-weight: 700; font-size: 16.5px; line-height: 1.3; }
.drow .dex { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.drow .dru, .drow .dtj { font-family: var(--f-tr); font-size: 15.5px; line-height: 1.35; }
.dict.test .dru span, .dict.test .dtj span { filter: blur(6px); cursor: pointer; }
.dict.test .drow.peek .dru span, .dict.test .drow.peek .dtj span { filter: none; }
.star { border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; color: var(--line); border-radius: 8px; }
.star svg { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--warn); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.flash { display: grid; justify-items: center; gap: 14px; }
.flashcard {
  width: 100%; max-width: 520px; min-height: 230px; border-radius: 20px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; text-align: center; padding: 26px; cursor: pointer; box-shadow: var(--shadow);
}
.flashcard .fc-en { font-size: 30px; font-weight: 800; font-family: var(--f-sign); line-height: 1.15; }
.flashcard .fc-tr { font-family: var(--f-tr); font-size: 20px; color: var(--muted); display: grid; gap: 4px; margin-top: 10px; }
.flashcard .fc-tr small { font-size: 12px; font-family: var(--f-body); font-weight: 700; color: var(--muted); }
.fc-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }

/* ---------- Modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(8, 14, 12, .55); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal {
  background: var(--surface); color: var(--ink); border-radius: 18px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.modal h2 { font-size: 22px; font-weight: 900; }
.field-row { display: grid; gap: 6px; }
.field-row label { font-weight: 700; font-size: 14px; }
.field-row input, .field-row select, .field-row textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
.field-row textarea { min-height: 90px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.field-row small { color: var(--muted); font-size: 13px; }
.modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 14.5px; z-index: 90;
  box-shadow: var(--shadow);
}
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--lake-soft); color: var(--lake-ink); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }
.notice svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.pager a { max-width: 48%; }
.pager .dir { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(310px, 86vw); z-index: 70;
    transform: translateX(-102%); transition: transform .22s ease; box-shadow: none;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  body.nav-open .side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  body.nav-open .scrim { display: block; }
  .menu-btn { display: inline-flex; }
}
.scrim { display: none; position: fixed; inset: 0; background: rgba(8,14,12,.45); z-index: 65; }
@media (max-width: 720px) {
  body { font-size: 16px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-art { min-height: 0; aspect-ratio: 640/300; }
  .read-grid, .two-col, .ticks { grid-template-columns: minmax(0, 1fr); }
  .line { max-width: 100%; }
  .guide { padding: 18px 18px 16px; }
  .teach-body { padding: 0 16px 16px; }
  .drow { grid-template-columns: 36px minmax(0, 1fr) 32px; }
  .drow .dru, .drow .dtj { grid-column: 2; }
  .drow .star { grid-column: 3; grid-row: 1; }
  .drow.head { display: none; }
  .tools .lbl-long { display: none; }
  .pager a { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Tests ---------- */
.tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.tcard {
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px 14px; padding: 16px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
}
.tcard:hover { border-color: var(--sign); }
.tcard.passed { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok), var(--shadow); }
.tc-badge { width: 56px; height: 56px; display: grid; place-items: center; }
.tc-badge svg { width: 56px; height: 56px; }
.tc-body { display: grid; gap: 6px; min-width: 0; }
.tc-body h3 { font-size: 18px; font-weight: 800; }
.tc-body p { font-size: 14.5px; color: var(--muted); line-height: 1.45; }
.tc-meta { display: flex; justify-content: space-between; gap: 4px 10px; font-size: 13px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.tc-state { display: inline-flex; align-items: center; gap: 4px; }
.tc-state svg { width: 15px; height: 15px; color: var(--ok); }
.tcard.passed .tc-state { color: var(--ok); }
.tcard .bar { grid-column: auto; }
.tc-go { grid-column: 2; justify-self: start; }

.trun { display: grid; gap: 14px; max-width: 780px; scroll-margin-top: 80px; }
.tq-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; font-family: var(--f-sign); font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tq-top .bar { grid-column: auto; height: 8px; }
.tq { padding: 20px; gap: 14px; }
.tq-kind { display: inline-block; font-family: var(--f-sign); font-weight: 900; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--sign-ink); }
.tq-title { font-size: 22px; font-weight: 800; }
.tq-audio { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.tq-audio .play { width: 58px; height: 58px; }
.tq-audio .play svg { width: 24px; height: 24px; }
.tq-said { flex-basis: 100%; font-size: 18px; font-weight: 600; background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }
.tq-cue { font-size: 18px; font-weight: 600; background: var(--warn-soft); color: var(--warn-ink); border-radius: 10px; padding: 12px 14px; line-height: 1.4; }
.tq-tr { display: grid; gap: 2px; font-family: var(--f-tr); font-size: 20px; }
.tq-tr small { font-family: var(--f-body); font-size: 12px; font-weight: 700; opacity: .75; }
.tq-sign { display: grid; place-items: center; padding: 6px; }
.tq-sign svg { width: 170px; height: 170px; }
.tq-fb { font-weight: 800; min-height: 1.3em; }
.tq-fb.good { color: var(--ok); }
.tq-fb.bad { color: var(--star); }
.tq-next { display: flex; justify-content: flex-end; }
.tq-next[hidden] { display: none; }
.result { display: flex; gap: 20px; align-items: center; padding: 22px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); }
.result.pass { border-color: var(--ok); background: var(--ok-soft); }
.res-score { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 50%; background: var(--sign); color: var(--on-sign); flex: none; font-family: var(--f-sign); }
.result.pass .res-score { background: var(--ok); }
.res-score b { font-size: 44px; line-height: 1; font-weight: 900; }
.res-score span { font-size: 14px; font-weight: 700; }
.result h2 { font-size: 26px; font-weight: 900; }
.result p { color: var(--muted); margin-top: 4px; }
.miss { display: grid; gap: 10px; }
.miss-row { display: flex; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.miss-sign svg { width: 64px; height: 64px; }
.miss-q { font-weight: 700; margin: 2px 0 6px; }
.miss-q span { display: block; font-weight: 500; color: var(--muted); }
.miss-a { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.miss-a > svg { width: 18px; height: 18px; flex: none; color: var(--ok); }
.miss-l { font-size: 13.5px; display: inline-block; margin-top: 6px; }

/* ---------- Chicago street corner (read it) ---------- */
.corner { display: flex; flex-direction: column; align-items: center; padding: 18px 8px 0; }
.ssign {
  display: flex; align-items: baseline; gap: 14px; padding: 6px 16px; border-radius: 5px; position: relative; z-index: 1;
  background: #0B6B47; color: #fff; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #0B6B47, var(--shadow); font-family: var(--f-sign);
}
.ssign b { font-size: 22px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.ssign small { font-size: 14px; font-weight: 700; white-space: nowrap; }
.ssign.s1 { margin-top: 6px; }
.pole { width: 12px; height: 150px; margin-top: -4px; border-radius: 3px; background: linear-gradient(90deg, #7F8A92, #C9D0D4, #7F8A92); }
.app-row.warn { background: #FDE7EA; border-color: #F3B4BF; color: #7A0F21; }

/* ---------- Teacher additions ---------- */
.box.later { margin-top: 14px; }
.later-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 6px 16px; margin-top: 6px; }
.week-table a svg { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; margin-right: 4px; }
.code-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.code { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; overflow-x: auto; white-space: pre; margin: 0; }

@media (max-width: 720px) {
  .unit-head { flex-wrap: wrap; }
  .unit-side { margin-left: 0; width: 100%; grid-auto-flow: column; justify-content: space-between; align-items: center; }
  .tq { padding: 16px; }
  .tq-title { font-size: 19px; }
  .result { flex-direction: column; text-align: center; }
  .tcard { grid-template-columns: 44px minmax(0, 1fr); }
  .tc-badge, .tc-badge svg { width: 44px; height: 44px; }
}
[id^="cp-"], #sync-setup { scroll-margin-top: 84px; }

/* ---------- Reference pages: grammar, verb forms, slang ---------- */
body:not(.lang-tj) .rt-tj, body.lang-tj .rt-ru { display: none !important; }
.rt { font-family: var(--f-tr); }
.ref-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.lang-sw button { padding: 8px 14px; font-family: var(--f-tr); font-size: 14.5px; }
.step-num svg { width: 20px; height: 20px; }
.en-in { font-family: var(--f-body); font-weight: 700; color: var(--sign-ink); }
.rquiz .rq-actions { display: flex; justify-content: flex-end; }
.rquiz .score b { color: var(--ink); }
.rquiz.passed .score { color: var(--ok); }

.gram-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.gcard {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.gcard:hover { border-color: var(--sign); }
.gcard.passed { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok), var(--shadow); }
.gnum { width: 38px; height: 38px; border-radius: 10px; background: var(--sign); color: var(--on-sign); display: grid; place-items: center; font-family: var(--f-sign); font-weight: 900; font-size: 17px; flex: none; }
.gbody { display: grid; gap: 4px; min-width: 0; }
.gbody h3 { font-size: 17.5px; font-weight: 800; }
.gshort { color: var(--muted); font-size: 14px; line-height: 1.4; }
.gstate { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.gstate svg, .mt-s svg { width: 15px; height: 15px; color: var(--ok); }
.gcard.passed .gstate { color: var(--ok); }
.gexplain { display: grid; gap: 10px; }
.gpara { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sign); border-radius: 12px; padding: 14px 16px; font-size: 17px; line-height: 1.6; }
.gtable { display: grid; gap: 8px; margin-top: 4px; }
.gtable h3 { font-size: 17px; font-weight: 800; }
.gex-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
.gex { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.gex-en { font-weight: 700; font-size: 17px; line-height: 1.35; }
.gex-tr { color: var(--muted); font-size: 15px; margin-top: 2px; }
.gmis-list { display: grid; gap: 10px; }
.gmis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; align-items: center; }
.gm-wrong, .gm-right { display: flex; align-items: center; gap: 8px; font-size: 16.5px; }
.gm-wrong { color: var(--star); }
.gm-wrong s { text-decoration-thickness: 2px; }
.gm-right b { color: var(--ink); }
.gm-wrong > svg, .gm-right > svg { width: 18px; height: 18px; flex: none; }
.gm-right > svg { color: var(--ok); }
.gm-note { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; }

.vhelp { gap: 10px; }
.vhelp p { font-size: 15.5px; line-height: 1.55; }
.vlist { display: grid; gap: 6px; }
.vrow {
  display: grid; grid-template-columns: 32px repeat(3, minmax(0, 1fr)) minmax(0, 1.5fr) 36px; gap: 6px 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 12px;
}
.vrow.irr { border-left: 4px solid var(--warn); }
.vf { display: grid; gap: 0; text-align: left; border: 0; background: transparent; padding: 0; font: inherit; color: inherit; min-width: 0; }
.vf b { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
.vf small { color: var(--muted); font-size: 12.5px; }
.vlab { font-family: var(--f-sign); font-size: 10.5px; font-weight: 900; letter-spacing: .06em; color: var(--muted); }
button.vf { cursor: default; }
.hide-forms button.vf { cursor: pointer; }
.hide-forms button.vf b { color: transparent; background: var(--surface-2); border-radius: 6px; }
.hide-forms button.vf.peek b { color: inherit; background: transparent; }
.vmean { font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.vtag { font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 1px 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-family: var(--f-body); }
.vtag.irr { background: var(--warn-soft); color: var(--warn-ink); }

.slang-intro { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.sint { align-content: start; }
.sint p { font-size: 15.5px; line-height: 1.5; }
.sint-en { color: var(--muted); }
.scat { display: grid; gap: 8px; margin-top: 18px; }
.scat-note { color: var(--muted); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 10px; }
.scard { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.s-top { display: flex; align-items: center; gap: 10px; }
.s-term { font-family: var(--f-sign); font-size: 19px; font-weight: 900; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.s-use { font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.s-use.use { background: var(--ok-soft); color: var(--ok); }
.s-use.know { background: var(--surface-2); color: var(--muted); }
.s-mean { font-weight: 700; }
.s-tr { color: var(--muted); font-size: 15px; }
.s-ex { display: flex; gap: 8px; align-items: center; font-size: 14.5px; font-style: italic; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }

.mini-tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.mtest { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14.5px; }
.mtest:hover { border-color: var(--sign); }
.mtest.passed { border-color: var(--ok); }
.mt-ic svg { width: 20px; height: 20px; color: var(--sign-ink); display: block; }
.mt-t { flex: 1; min-width: 0; }
.mt-s { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-sign); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.mtest.passed .mt-s { color: var(--ok); }

/* ---------- Translator modal ---------- */
.tx-btn svg { width: 19px; height: 19px; }
.modal .tx-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tx-top h2 { display: flex; align-items: center; gap: 10px; }
.tx-top h2 svg { width: 24px; height: 24px; color: var(--sign-ink); }
.tx-input { display: flex; gap: 8px; }
.tx-input input {
  flex: 1; min-width: 0; width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px;
  font: inherit; font-size: 18px; background: var(--surface); color: var(--ink);
}
.tx-input input:focus { border-color: var(--focus); outline: 0; }
.tx-input .btn { min-height: 48px; }
.tx-langs { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
#tx-out { display: grid; gap: 12px; }
#tx-out:empty { display: none; }
.tx-card { display: grid; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 16px; }
.tx-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.tx-word { font-family: var(--f-sign); font-size: 28px; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
.tx-ipa { font-family: 'Lucida Sans Unicode', 'Arial Unicode MS', 'Segoe UI', var(--f-body); font-size: 18px; color: var(--sign-ink); }
.tx-sound { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tx-sound .play { width: 46px; height: 46px; }
.tx-card .heard { margin: 0; }
.tx-mean, .tx-from { display: grid; gap: 2px; }
.tx-mean b { font-family: var(--f-tr); font-size: 22px; line-height: 1.3; }
.tx-lab { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tx-alt { display: grid; gap: 2px; font-family: var(--f-tr); font-size: 15px; color: var(--muted); }
.tx-alt i, .tx-defs i { font-family: var(--f-body); font-style: normal; font-weight: 700; font-size: 12.5px; color: var(--sign-ink); margin-right: 4px; }
.tx-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14.5px; }
.tx-note svg { width: 18px; height: 18px; flex: none; }
.tx-note.warn { background: var(--warn-soft); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; }
.tx-book, .tx-defs { display: grid; gap: 8px; }
.tx-book h4, .tx-defs h4 { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tx-row { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tx-row small { display: block; color: var(--muted); font-size: 12.5px; }
.tx-row .tx-src { font-weight: 700; }
.tx-note-in { color: var(--muted); font-size: 13.5px; }
.tx-defs p { font-size: 15px; }
.tx-tip { color: var(--muted); font-size: 14px; }
.tx-hist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }

@media (max-width: 720px) {
  .vrow { grid-template-columns: 32px repeat(3, minmax(0, 1fr)) 32px; padding: 8px 8px 8px 10px; gap: 4px 8px; }
  .vrow .vmean { grid-column: 2 / -1; grid-row: 2; }
  .vrow .star { grid-column: 5; grid-row: 1; width: 32px; }
  .vf b { font-size: 15.5px; }
  .gmis { grid-template-columns: minmax(0, 1fr); }
  .gpara { font-size: 16px; padding: 12px 14px; }
  .tx-word { font-size: 24px; }
  .tx-input .lbl-long { display: none; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Book menu"></aside>
  <div class="scrim" data-act="menu"></div>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="modal-root"></div>
<script>
/* US road signs, drawn in their real colors (they look the same in light and dark themes).
   Each function returns inner SVG for a 120 x 120 viewBox. */
(function () {
  const F = "font-family=\"Overpass, Arial Narrow, Arial, sans-serif\" font-weight=\"800\" text-anchor=\"middle\"";
  const T = (x, y, s, txt, fill = '#111') => `<text x="${x}" y="${y}" font-size="${s}" fill="${fill}" ${F}>${txt}</text>`;
  const diamond = (fill, inner) => `<g><rect x="25" y="25" width="70" height="70" rx="6" transform="rotate(45 60 60)" fill="${fill}" stroke="#111" stroke-width="3"/><rect x="29.5" y="29.5" width="61" height="61" rx="4" transform="rotate(45 60 60)" fill="none" stroke="#111" stroke-width="2"/>${inner}</g>`;
  const rectSign = (fill, stroke, inner, y = 14, h = 92, x = 14, w = 92) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="3"/><rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" rx="4" fill="none" stroke="${stroke === '#111' ? '#111' : '#fff'}" stroke-width="2"/>${inner}`;
  const truck = (x, y, s = 1, c = '#111') => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><rect x="0" y="0" width="34" height="18" rx="1.5"/><path d="M35 5h9l6 7v6H35z"/><circle cx="7" cy="21" r="3.6"/><circle cx="16" cy="21" r="3.6"/><circle cx="44" cy="21" r="3.6"/></g>`;

  window.SIGNS = {
    stop: { name: 'STOP', mean: 'I have to stop completely, then go when it is safe.', svg: () => `<polygon points="80.7,10.1 109.9,39.3 109.9,80.7 80.7,109.9 39.3,109.9 10.1,80.7 10.1,39.3 39.3,10.1" fill="#C8102E"/><polygon points="78.6,15.2 104.8,41.4 104.8,78.6 78.6,104.8 41.4,104.8 15.2,78.6 15.2,41.4 41.4,15.2" fill="none" stroke="#fff" stroke-width="3"/>${T(60, 71, 30, 'STOP', '#fff')}` },
    yield: { name: 'YIELD', mean: 'I have to slow down and let other cars go first.', svg: () => `<polygon points="8,16 112,16 60,106" fill="#C8102E"/><polygon points="27,26 93,26 60,83" fill="#fff"/>${T(60, 45, 13, 'YIELD', '#C8102E')}` },
    doNotEnter: { name: 'DO NOT ENTER', mean: 'I cannot drive into this road.', svg: () => `<circle cx="60" cy="60" r="52" fill="#C8102E"/><rect x="20" y="52" width="80" height="16" fill="#fff"/>${T(60, 42, 13, 'DO NOT', '#fff')}${T(60, 88, 13, 'ENTER', '#fff')}` },
    wrongWay: { name: 'WRONG WAY', mean: 'I am going the wrong way. I have to turn around safely.', svg: () => `<rect x="10" y="26" width="100" height="68" rx="6" fill="#C8102E"/><rect x="14" y="30" width="92" height="60" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>${T(60, 57, 20, 'WRONG', '#fff')}${T(60, 81, 20, 'WAY', '#fff')}` },
    oneWay: { name: 'ONE WAY', mean: 'Cars on this street go only in the direction of the arrow.', svg: () => `<rect x="6" y="38" width="108" height="44" rx="4" fill="#111"/><path d="M14 52h68v-8l22 16-22 16v-8H14z" fill="#fff"/>${T(50, 65, 13, 'ONE WAY')}` },
    noTrucks: { name: 'NO TRUCKS', mean: 'Trucks are not allowed on this road.', svg: () => `${rectSign('#fff', '#111', '')}${truck(33, 49, 1.05)}<circle cx="60" cy="60" r="36" fill="none" stroke="#C8102E" stroke-width="7"/><line x1="35" y1="35" x2="85" y2="85" stroke="#C8102E" stroke-width="7"/>` },
    speed30: { name: 'SPEED LIMIT 30', mean: 'I cannot drive faster than 30 miles per hour.', svg: () => `<rect x="24" y="8" width="72" height="104" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><rect x="28" y="12" width="64" height="96" rx="4" fill="none" stroke="#111" stroke-width="1.5"/>${T(60, 36, 13, 'SPEED')}${T(60, 52, 13, 'LIMIT')}${T(60, 96, 40, '30')}` },
    truckSpeed: { name: 'TRUCKS 55', mean: 'The speed limit for trucks is 55 miles per hour.', svg: () => `<rect x="24" y="8" width="72" height="104" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>${T(60, 40, 15, 'TRUCKS')}${T(60, 92, 40, '55')}` },
    noTurnRed: { name: 'NO TURN ON RED', mean: 'When the light is red, I cannot turn. I wait for green.', svg: () => `<rect x="20" y="14" width="80" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>${T(60, 44, 16, 'NO')}${T(60, 66, 16, 'TURN')}${T(60, 92, 16, 'ON RED', '#C8102E')}` },
    noParking: { name: 'NO PARKING ANY TIME', mean: 'I cannot park here at any time.', svg: () => `<rect x="22" y="10" width="76" height="100" rx="6" fill="#fff" stroke="#C8102E" stroke-width="3"/>${T(60, 38, 16, 'NO', '#C8102E')}${T(60, 62, 14, 'PARKING', '#C8102E')}${T(60, 84, 14, 'ANY', '#C8102E')}${T(60, 102, 14, 'TIME', '#C8102E')}` },
    loading: { name: 'LOADING ZONE', mean: 'Only for loading and unloading, for a short time.', svg: () => `<rect x="22" y="10" width="76" height="100" rx="6" fill="#fff" stroke="#C8102E" stroke-width="3"/>${T(60, 42, 15, 'LOADING', '#C8102E')}${T(60, 64, 15, 'ZONE', '#C8102E')}${T(60, 88, 11, '7AM-6PM', '#111')}${T(60, 102, 11, 'MON-FRI', '#111')}` },
    weigh: { name: 'WEIGH STATION', mean: 'Trucks have to go to the weigh station at the next exit on the right.', svg: () => `${rectSign('#0B6B47', '#0B6B47', `${T(60, 46, 15, 'WEIGH', '#fff')}${T(60, 66, 15, 'STATION', '#fff')}${T(60, 90, 12, 'NEXT RIGHT', '#fff')}`)}` },
    trucksExit: { name: 'ALL TRUCKS MUST EXIT', mean: 'All trucks have to leave the highway here, usually for the scale.', svg: () => `${rectSign('#fff', '#111', `${T(60, 46, 12, 'ALL TRUCKS')}${T(60, 68, 14, 'MUST')}${T(60, 90, 14, 'EXIT')}`)}` },
    lowClear: { name: "LOW CLEARANCE 13'-6\"", mean: "The bridge is low: 13 feet 6 inches. If my truck is taller, I can't go under it.", svg: () => diamond('#FFCC00', `${T(60, 69, 19, '13\'-6"')}<path d="M60 26l-6 9h12z M60 94l-6-9h12z" fill="#111"/><rect x="58.5" y="34" width="3" height="10" fill="#111"/><rect x="58.5" y="76" width="3" height="10" fill="#111"/>`) },
    weightLimit: { name: 'WEIGHT LIMIT 10 TONS', mean: 'Vehicles heavier than 10 tons cannot use this road or bridge.', svg: () => `<rect x="20" y="10" width="80" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>${T(60, 36, 14, 'WEIGHT')}${T(60, 54, 14, 'LIMIT')}${T(60, 86, 30, '10')}${T(60, 104, 13, 'TONS')}` },
    steep: { name: 'STEEP GRADE', mean: 'A steep hill is ahead. I have to slow down and use a low gear.', svg: () => diamond('#FFCC00', `<path d="M32 78 L88 54 L88 78 Z" fill="#111"/>${truck(48, 45, .62)}${T(60, 96, 11, '8%')}`) },
    runaway: { name: 'RUNAWAY TRUCK RAMP', mean: 'If my brakes fail on the hill, I can use this ramp to stop.', svg: () => `${rectSign('#FFCC00', '#111', `${T(60, 46, 14, 'RUNAWAY')}${T(60, 68, 14, 'TRUCK')}${T(60, 90, 14, 'RAMP')}`)}` },
    bridgeIces: { name: 'BRIDGE ICES BEFORE ROAD', mean: 'The bridge gets icy first in cold weather. I drive slowly.', svg: () => diamond('#FFCC00', `${T(60, 50, 10, 'BRIDGE')}${T(60, 62, 10, 'ICES')}${T(60, 74, 10, 'BEFORE')}${T(60, 86, 10, 'ROAD')}`) },
    roadWork: { name: 'ROAD WORK AHEAD', mean: 'There is construction ahead. I slow down and watch for workers.', svg: () => diamond('#F47B20', `${T(60, 52, 12, 'ROAD')}${T(60, 67, 12, 'WORK')}${T(60, 82, 12, 'AHEAD')}`) },
    laneEnds: { name: 'LANE ENDS MERGE LEFT', mean: 'My lane ends soon. I have to move into the left lane.', svg: () => `${rectSign('#FFCC00', '#111', `${T(60, 42, 13, 'LANE ENDS')}${T(60, 66, 13, 'MERGE')}${T(60, 90, 13, 'LEFT')}`)}` },
    dms: { name: 'MESSAGE SIGN', mean: 'There is a crash ahead and the left lane is closed. I move right and slow down.', svg: () => `<rect x="4" y="28" width="112" height="64" rx="4" fill="#111" stroke="#555" stroke-width="2"/><text x="60" y="54" font-size="13" fill="#FFB000" font-family="ui-monospace, Menlo, monospace" font-weight="700" text-anchor="middle">CRASH AHEAD</text><text x="60" y="76" font-size="11" fill="#FFB000" font-family="ui-monospace, Menlo, monospace" font-weight="700" text-anchor="middle">LEFT LN CLOSED</text>` },
    exitGuide: { name: 'EXIT SIGN', mean: 'The exit for Addison Street is half a mile ahead.', svg: () => `<rect x="4" y="22" width="112" height="76" rx="6" fill="#0B6B47"/><rect x="8" y="26" width="104" height="68" rx="4" fill="none" stroke="#fff" stroke-width="2"/>${T(60, 54, 18, 'Addison St', '#fff')}${T(60, 80, 13, 'EXIT 1/2 MILE', '#fff')}` },
    street: { name: 'CHICAGO STREET SIGN', mean: 'Chicago street signs show the street name and its grid number (1700 N = 17 blocks north of Madison).', svg: () => `<rect x="2" y="38" width="116" height="44" rx="4" fill="#0B6B47"/><rect x="5" y="41" width="110" height="38" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>${T(56, 67, 13.5, 'W Wabansia Av', '#fff')}<text x="108" y="52" font-size="7" fill="#fff" font-family="Arial" text-anchor="end" font-weight="700">1700 N</text>` }
  };

  window.SIGNKIT = { T, diamond, rectSign, truck, F };
  window.signSVG = (id, cls = '') => `<svg viewBox="0 0 120 120" class="${cls}" role="img" aria-label="${(window.SIGNS[id] || {}).name || id}">${window.SIGNS[id].svg()}</svg>`;

  /* Interstate-style shield for unit numbers */
  window.shieldSVG = (n) => `<svg class="shield" viewBox="0 0 52 56" aria-hidden="true"><path d="M3 4 Q13 1 26 6 Q39 1 49 4 Q52 22 48 34 Q42 49 26 54 Q10 49 4 34 Q0 22 3 4Z" fill="#fff" stroke="#173E7A" stroke-width="2"/><path d="M6 7 Q15 4.5 26 9 Q37 4.5 46 7 L46.6 16 H5.4Z" fill="#C8102E"/><path d="M5.4 18 H46.6 Q47.5 27 45 33 Q40 46 26 51 Q12 46 7 33 Q4.5 27 5.4 18Z" fill="#173E7A"/><text x="26" y="14.5" font-size="6.5" fill="#fff" ${F}>UNIT</text><text x="26" y="42" font-size="22" fill="#fff" ${F}>${n}</text></svg>`;
})();

/* More US road signs for the road-signs unit (real colors). */
(function () {
  const { T, diamond, rectSign, truck } = window.SIGNKIT;
  const slash = '<circle cx="60" cy="60" r="38" fill="none" stroke="#C8102E" stroke-width="7"/><line x1="33" y1="33" x2="87" y2="87" stroke="#C8102E" stroke-width="7"/>';
  const ln = (d, w = 8) => `<path d="${d}" fill="none" stroke="#111" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const ORANGE = '#F47B20', YEL = '#FFCC00', SCH = '#C5E000', GRN = '#0B6B47';
  Object.assign(window.SIGNS, {
    noLeft: { name: 'NO LEFT TURN', mean: 'I cannot turn left here.', svg: () => `${rectSign('#fff', '#111', '')}${ln('M66 90 V60 Q66 50 56 50 H44', 9)}<polygon points="46,38 30,50 46,62" fill="#111"/>${slash}` },
    noUturn: { name: 'NO U-TURN', mean: 'I cannot turn around here.', svg: () => `${rectSign('#fff', '#111', '')}${ln('M48 90 V56 A13 13 0 0 1 74 56 V64', 9)}<polygon points="63,62 85,62 74,78" fill="#111"/>${slash}` },
    keepRight: { name: 'KEEP RIGHT', mean: 'I have to drive on the right side of the divider.', svg: () => `<rect x="22" y="8" width="76" height="104" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>${T(60, 34, 15, 'KEEP')}${T(60, 54, 15, 'RIGHT')}<rect x="36" y="64" width="14" height="38" rx="7" fill="#111"/>${ln('M62 64 L72 92', 6)}<polygon points="64,90 80,86 76,102" fill="#111"/>` },
    doNotPass: { name: 'DO NOT PASS', mean: 'I cannot pass the car in front of me here.', svg: () => rectSign('#fff', '#111', `${T(60, 52, 18, 'DO NOT')}${T(60, 80, 18, 'PASS')}`) },
    rightLaneTurn: { name: 'RIGHT LANE MUST TURN RIGHT', mean: 'If I am in the right lane, I have to turn right.', svg: () => rectSign('#fff', '#111', `${T(60, 44, 12, 'RIGHT LANE')}${T(60, 64, 12, 'MUST')}${T(60, 84, 12, 'TURN RIGHT')}`) },
    towZone: { name: 'TOW ZONE', mean: 'If I park here, my car can be towed away.', svg: () => `<rect x="20" y="10" width="80" height="100" rx="6" fill="#fff" stroke="#C8102E" stroke-width="3"/>${T(60, 44, 22, 'TOW', '#C8102E')}${T(60, 70, 22, 'ZONE', '#C8102E')}${T(60, 94, 11, 'NO PARKING')}` },
    speedSchool: { name: 'SCHOOL SPEED LIMIT 20', mean: 'Near a school I drive 20 miles per hour when children are there.', svg: () => `<rect x="22" y="6" width="76" height="108" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><rect x="25" y="9" width="70" height="20" rx="3" fill="${SCH}"/>${T(60, 24, 12, 'SCHOOL')}${T(60, 44, 11, 'SPEED LIMIT')}${T(60, 76, 30, '20')}${T(60, 92, 8, 'WHEN CHILDREN')}${T(60, 103, 8, 'ARE PRESENT')}` },
    schoolZone: { name: 'SCHOOL CROSSING', mean: 'Children cross here. I slow down and watch for them.', svg: () => `<polygon points="60,8 108,46 108,110 12,110 12,46" fill="${SCH}" stroke="#111" stroke-width="3"/><circle cx="46" cy="52" r="7" fill="#111"/><circle cx="74" cy="46" r="8" fill="#111"/>${ln('M46 60 L44 80 M44 80 L38 98 M44 80 L52 97 M45 66 L36 76 M45 66 L56 72', 6)}${ln('M74 55 L74 78 M74 78 L66 98 M74 78 L83 97 M74 62 L64 72 M74 62 L85 70', 7)}` },

      ru: 'Четыре способа: 1) Звуки сливаются и сокращаются: «going to» → «gonna». 2) Старые слова получают новое значение: «cool» = хорошо, «buck» = доллар. 3) Буквы заменяют слова: ASAP, ETA. 4) У каждой группы свои слова: курьеры, дальнобойщики по рации, жители Чикаго.',
      tj: 'Чор роҳ: 1) Садоҳо якҷо ва кӯтоҳ мешаванд: «going to» → «gonna». 2) Калимаҳои кӯҳна маънои нав мегиранд: «cool» = хуб, «buck» = доллар. 3) Ҳарфҳо ба ҷои калимаҳо меоянд: ASAP, ETA. 4) Ҳар гурӯҳ калимаҳои худро дорад: курйерҳо, ронандагони боркаш дар радио, сокинони Чикаго.' },
    { t: 'When can I use it?',
      en: 'Understand all of it. Say the green ones (“use”) with friends, coworkers and customers. With the police, at government offices, in a job interview and in writing, speak clearly and politely, without slang.',
      ru: 'Понимать нужно всё. Зелёные («use») можно говорить с друзьями, коллегами и клиентами. С полицией, в госучреждениях, на собеседовании и в письменных сообщениях говори чётко и вежливо, без сленга.',
      tj: 'Ҳамаашро фаҳмидан лозим. Сабзҳоро («use») бо дӯстон, ҳамкорон ва мизоҷон гуфтан мумкин. Бо полис, дар идораҳои давлатӣ, дар мусоҳиба ва дар паёмҳои хаттӣ равшан ва боадабона, бе сленг гап зан.' }

  const SYNC_URL_DEFAULT = '';

  const TTS = {

    init() {

    },
    gender(v) {

      if (this.cache && this.cache[key]) return this.cache[key];
